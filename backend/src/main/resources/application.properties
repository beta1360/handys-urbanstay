spring.application.name=urbanstay
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.mvc.format.date=iso
spring.docker.compose.lifecycle-management=start-only
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID
urbanstay.openapi.title=Urbanstay API
urbanstay.openapi.version=v1
springdoc.default-produces-media-type=application/json
springdoc.api-docs.resolve-schema-properties=true
springdoc.enable-default-api-docs=false
urbanstay.initial-admin.login-id=beta1360sh@gmail.com
urbanstay.initial-admin.password=Admin1234!
urbanstay.initial-admin.name=Admin
