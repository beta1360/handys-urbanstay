openapi.hotel-admin.operation.getSettlement.summary=월별 정산 조회(마스터 전용)
openapi.hotel-admin.operation.getSettlement.description=로그인한 마스터의 호텔에서 체크인 날짜가 그 달(한국 날짜 기준 1일~말일)인 이용을 모아 정산합니다. totalAmount는 취소하지 않은 이용의 최종 금액 합계(원), stayCount는 취소하지 않은 이용 건수, canceledCount는 취소한 이용 건수입니다. 이용이 없는 달이면 모두 0입니다. 다른 호텔의 이용은 들어가지 않습니다. month는 필수이고 "YYYY-MM" 형식(예: 2026-11)만 받습니다. 빠지면 400 INVALID_INPUT(fieldErrors에 month, 필수), 형식이 틀리면(예: 2026-13, 2026-1, 2026-11-01) 400 INVALID_INPUT(fieldErrors에 month, 타입)으로 응답합니다. 마스터만 쓰고 운영자 계정은 403 FORBIDDEN입니다.
openapi.hotel-admin.operation.getSettlement.parameter.month=정산할 달("YYYY-MM", 예: 2026-11)
openapi.hotel-admin.operation.getSettlementStays.summary=월별 이용 로그 조회(마스터 전용)
openapi.hotel-admin.operation.getSettlementStays.description=로그인한 마스터의 호텔에서 체크인 날짜가 그 달(1일~말일)인 이용을 취소한 이용까지 체크인 날짜 오름차순(같으면 이용 id 오름차순)으로 페이지로 나눠 조회합니다. 월별 정산에 들어간 이용과 같은 범위입니다. 취소한 이용은 canceledAt에 취소 시각이 담기고, 금액은 취소해도 그대로 담깁니다. 객실 이름, 객실 유형, 이용객 이름은 조회하는 시점의 값입니다(객실 유형은 지금 그 객실의 유형). 다른 호텔의 이용은 나오지 않습니다. month 규칙은 월별 정산 조회와 같습니다. page는 0~99(기본 0), size는 1~100(기본 10)이고, 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다. 마스터만 쓰고 운영자 계정은 403 FORBIDDEN입니다.
openapi.hotel-admin.operation.getSettlementStays.parameter.month=조회할 달("YYYY-MM", 예: 2026-11)
openapi.hotel-admin.operation.getSettlementStays.parameter.page=페이지 번호. 0~99, 기본 0
openapi.hotel-admin.operation.getSettlementStays.parameter.size=페이지 크기. 1~100, 기본 10
