openapi.hotel-admin.operation.getStays.parameter.keyword=이용객 검색어(선택). 이용객 이름(대소문자 구분 없이)이나 전화번호(양쪽 하이픈을 빼고)에 들어 있는 이용을 글자 그대로 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 거르지 않습니다.
openapi.hotel-admin.operation.getStays.parameter.checkInFrom=체크인 기간의 시작 날짜(선택, "YYYY-MM-DD"). 체크인 날짜가 이 날이거나 뒤인 이용만 조회합니다.
openapi.hotel-admin.operation.getStays.parameter.checkInTo=체크인 기간의 끝 날짜(선택, "YYYY-MM-DD"). 체크인 날짜가 이 날이거나 앞인 이용만 조회합니다. checkInFrom보다 이르면 400입니다.
validation.from-or-later=시작 날짜와 같거나 뒤 날짜를 입력해 주세요.
openapi.schema.GuestDetailHotelAdminResponse.id=이용객 ID
openapi.schema.GuestDetailHotelAdminResponse.name=이름
openapi.schema.GuestDetailHotelAdminResponse.phone=전화번호(입력한 모양 그대로)
openapi.schema.GuestDetailHotelAdminResponse.email=이메일(입력한 그대로)
openapi.schema.GuestDetailHotelAdminResponse.currentStay=지금 이용. 오늘(한국 시간)이 기간 안에 있는 취소하지 않은 이용이고, 여러 개면 체크인 날짜가 이른 하나입니다. 없으면 null
openapi.schema.GuestDetailHotelAdminResponse.version=버전. 이용객 정보가 바뀌어 저장될 때마다 커집니다. 수정 요청에 그대로 보냅니다.
openapi.schema.GuestCurrentStayHotelAdminResponse.id=이용 ID
openapi.schema.GuestCurrentStayHotelAdminResponse.room=이용 중인 객실(조회 시점의 이름과 유형)
openapi.schema.GuestCurrentStayHotelAdminResponse.checkInDate=체크인 날짜("YYYY-MM-DD")
openapi.schema.GuestCurrentStayHotelAdminResponse.checkOutDate=체크아웃 날짜("YYYY-MM-DD"). 이 날은 묵지 않습니다.
openapi.schema.GuestCurrentStayRoomHotelAdminResponse.id=객실 ID
openapi.schema.GuestCurrentStayRoomHotelAdminResponse.name=객실 이름(호수)
openapi.schema.GuestCurrentStayRoomHotelAdminResponse.roomType=객실 유형(id와 조회 시점의 이름)
openapi.schema.GuestCurrentStayRoomTypeHotelAdminResponse.id=객실 유형 ID
openapi.schema.GuestCurrentStayRoomTypeHotelAdminResponse.name=객실 유형 이름
