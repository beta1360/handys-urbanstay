openapi.app-admin.operation.getMemberStays.description=회원과 연결된 이용객(모든 호텔)의 이용을 페이지로 나눠 조회합니다. 취소한 이용도 함께 보여주고 canceledAt으로 구분합니다. 체크인 날짜 내림차순, 같으면 이용 id 내림차순입니다. 호텔과 객실(호수)은 조회할 때의 값입니다. 이용객은 회원이 예약할 때 그 호텔에서 회원 전화번호(숫자만 비교)와 같은 이용객으로 연결되므로, 회원 기능 전에 같은 전화번호로 그 호텔에 예약했던 이용도 포함될 수 있습니다. 없는 회원이면 404 MEMBER_NOT_FOUND로 응답합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
