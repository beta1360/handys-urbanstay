openapi.hotel-admin.tag.guest=이용객 조회·수정(마스터·운영자)
openapi.hotel-admin.operation.getGuests.summary=이용객 목록 조회
openapi.hotel-admin.operation.getGuests.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 이용객 목록을 최근 등록 순(id 내림차순)으로 페이지로 나눠 조회합니다. 다른 호텔의 이용객은 나오지 않습니다. keyword를 보내면 이름에 keyword가 들어 있거나(대소문자 구분 없음) 전화번호에 keyword가 들어 있는(전화번호와 keyword 양쪽의 하이픈을 빼고 비교, 예: 01012345678로 010-1234-5678을 찾음) 이용객을 찾습니다. %, _, \ 같은 문자도 글자 그대로 찾습니다. 하이픈만 있는 keyword는 이름에서만 찾습니다. keyword는 앞뒤 공백을 지운 뒤 100자 이하이고, 없거나 비어 있거나 공백만 있으면 전체를 조회합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. totalElements와 totalPages는 검색 결과 기준이며, totalPages가 100을 넘어도 page는 99까지만 받으므로 그 뒤의 이용객은 keyword로 좁혀 찾습니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.hotel-admin.operation.getGuests.parameter.keyword=검색어(선택). 이름(대소문자 구분 없음)이나 전화번호(양쪽의 하이픈을 빼고 비교)에 들어 있는 이용객을 글자 그대로 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 전체를 조회합니다.
openapi.hotel-admin.operation.getGuests.parameter.page=페이지 번호. 0~99, 기본 0
openapi.hotel-admin.operation.getGuests.parameter.size=페이지 크기. 1~100, 기본 10
openapi.hotel-admin.operation.getGuest.summary=이용객 조회
openapi.hotel-admin.operation.getGuest.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 이용객 하나를 조회합니다. 수정 요청에 보낼 version이 함께 옵니다. 지금 이용(currentStay)은 오늘(한국 시간)이 체크인 날짜부터 체크아웃 전날 사이에 있는 취소하지 않은 이용이고, 여러 객실을 함께 이용 중이면 체크인 날짜가 이른 이용(같으면 이용 id가 작은 이용) 하나이며, 없으면 null입니다. 없는 id와 다른 호텔의 이용객 id는 모두 404 GUEST_NOT_FOUND로 응답합니다.
openapi.hotel-admin.operation.updateGuest.summary=이용객 수정
openapi.hotel-admin.operation.updateGuest.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 이용객의 이름, 전화번호, 이메일을 요청 값으로 바꿉니다. 이름, 전화번호, 이메일은 앞뒤 공백을 지운 뒤 검사하고 저장하며, 최대 길이도 지운 값으로 셉니다. 공백만 있는 값은 빈 값으로 봅니다. 전화번호와 이메일은 앞뒤 공백만 지우고 입력한 모양 그대로(하이픈 위치, 대소문자 포함) 저장합니다. 다른 호텔의 이용객과는 전화번호가 같아도 되고, 이름과 이메일은 같은 호텔에서도 겹쳐도 됩니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 수정해 version이 다르면 409 GUEST_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 GUEST_MODIFIED입니다. 같은 호텔의 다른 이용객과 하이픈을 뺀 전화번호 숫자가 같아지면 409 GUEST_PHONE_DUPLICATED로 응답합니다. 자기 전화번호를 그대로 두거나 하이픈 모양만 바꾸는 수정은 됩니다. version이 다르면서 전화번호도 겹치면 GUEST_MODIFIED입니다. 성공하면 수정한 이용객을 최신 version과 지금 이용(currentStay, 이용객 조회와 같은 기준)과 함께 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 없는 id와 다른 호텔의 이용객 id는 모두 404 GUEST_NOT_FOUND로 응답합니다.
openapi.schema.GuestUpdateHotelAdminRequest.name=이용객 이름. 앞뒤 공백을 지운 뒤 1~50자. 같은 호텔의 다른 이용객과 같아도 됩니다.
openapi.schema.GuestUpdateHotelAdminRequest.phone=전화번호. 예: 010-1234-5678. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다. 같은 호텔의 다른 이용객과 하이픈을 뺀 숫자가 같아지면 수정할 수 없고, 다른 호텔의 이용객과는 같아도 됩니다.
openapi.schema.GuestUpdateHotelAdminRequest.email=이메일. 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다. 대소문자를 바꾸지 않고 입력한 그대로 저장하며, 다른 이용객과 같아도 됩니다.
openapi.schema.GuestUpdateHotelAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 GUEST_MODIFIED입니다.
openapi.schema.GuestHotelAdminResponse.id=이용객 ID
openapi.schema.GuestHotelAdminResponse.name=이름
openapi.schema.GuestHotelAdminResponse.phone=전화번호(입력한 모양 그대로)
openapi.schema.GuestHotelAdminResponse.email=이메일(입력한 그대로)
openapi.schema.GuestHotelAdminResponse.version=버전. 이용객 정보가 바뀌어 저장될 때마다 커집니다. 수정 요청에 그대로 보냅니다.
success.guest.updated=이용객 정보를 수정했습니다.
error.STAY_NOT_FOUND=이용을 찾을 수 없습니다.
error.STAY_PERIOD_OVERLAPPED=같은 객실에 기간이 겹치는 이용이 이미 있습니다.
error.STAY_ALREADY_CANCELED=이미 취소한 이용입니다.
error.STAY_ALREADY_ENDED=이미 끝난 이용은 취소할 수 없습니다.
validation.today-or-later=오늘 이후 날짜를 입력해 주세요.
validation.after-check-in=체크인 날짜보다 뒤 날짜를 입력해 주세요.
validation.max-nights=최대 {max}박까지 등록할 수 있습니다.
success.stay.canceled=이용을 취소했습니다.
openapi.hotel-admin.tag.stay=이용 조회·취소(마스터·운영자)와 월별 정산(마스터)
openapi.hotel-admin.operation.getStays.summary=이용 목록 조회
openapi.hotel-admin.operation.getStays.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 이용 목록을 체크인 날짜 내림차순(같으면 이용 id 내림차순)으로 페이지로 나눠 조회합니다. 다른 호텔의 이용은 나오지 않고, 취소한 이용도 함께 나옵니다. roomId를 보내면 그 객실의 이용만, guestId를 보내면 그 이용객의 이용만, canceled를 보내면 취소 여부가 맞는 이용만 조회합니다. keyword를 보내면 이용객 이름(대소문자 구분 없이)이나 전화번호(저장된 번호와 keyword 양쪽의 하이픈을 빼고)에 keyword가 들어 있는 이용만 찾고, %, _, \\ 같은 문자도 글자 그대로 찾습니다. 하이픈만 있는 keyword는 전화번호로는 찾지 않습니다. checkInFrom·checkInTo를 보내면 체크인 날짜가 그 사이(양 끝 포함)인 이용만 조회하고, 하나만 보내도 됩니다. 모든 조건은 함께 보내면 모두 맞는 이용만 조회합니다. 없는 id나 다른 호텔의 id로 거르면 빈 목록입니다. 객실 이름과 이용객의 이름·전화번호는 조회하는 시점의 값입니다. canceled가 true, false가 아니면(대문자, 빈 값 등) 400 INVALID_INPUT으로 응답하고 fieldErrors에 canceled를 담습니다. 날짜가 YYYY-MM-DD 형식이 아니면 그 파라미터를, checkInFrom이 checkInTo보다 늦으면 checkInTo를 fieldErrors에 담아 400 INVALID_INPUT으로 응답합니다.
openapi.hotel-admin.operation.getStays.parameter.roomId=객실 ID(선택). 그 객실의 이용만 조회합니다.
openapi.hotel-admin.operation.getStays.parameter.guestId=이용객 ID(선택). 그 이용객의 이용만 조회합니다.
openapi.hotel-admin.operation.getStays.parameter.canceled=취소 여부(선택). true면 취소한 이용만, false면 취소하지 않은 이용만 조회하고, 보내지 않으면 모두 조회합니다.
openapi.hotel-admin.operation.getStays.parameter.page=페이지 번호. 0~99, 기본 0
openapi.hotel-admin.operation.getStays.parameter.size=페이지 크기. 1~100, 기본 10
openapi.hotel-admin.operation.getStay.summary=이용 조회
openapi.hotel-admin.operation.getStay.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 이용 하나를 조회합니다. 취소한 이용도 조회하며 cancellation에 취소 정보가 담깁니다. 객실 이름과 이용객의 이름·전화번호는 조회하는 시점의 값입니다. 없는 id와 다른 호텔의 이용 id는 모두 404 STAY_NOT_FOUND로 응답합니다.
openapi.hotel-admin.operation.cancelStay.summary=이용 취소
openapi.hotel-admin.operation.cancelStay.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 이용을 취소합니다. 본문의 reason에 취소 사유를 보낼 수 있고(선택), 사유 없이 취소하려면 빈 객체({})를 보냅니다. 취소 시각, 취소를 처리한 계정(id와 그때의 이름), 사유를 기록하며 취소는 되돌릴 수 없습니다. 끝나지 않은 이용(체크아웃 날짜가 오늘(한국 시간)보다 뒤)만 취소할 수 있고, 체크아웃 날짜가 오늘이거나 지난 이용은 409 STAY_ALREADY_ENDED로 응답합니다. 이미 취소한 이용은 409 STAY_ALREADY_CANCELED로 응답하며, 끝난 이용이어도 이미 취소했으면 STAY_ALREADY_CANCELED입니다. 같은 이용을 동시에 취소하면 한 번만 기록되고 나머지는 409 STAY_ALREADY_CANCELED입니다. 취소한 이용은 겹침 검사에서 빠지므로 같은 객실의 같은 기간을 게스트 앱에서 다시 예약할 수 있습니다. 취소할 때 객실 상태가 RESERVED(예약됨)이면 VACANT(공실)로 바꾸고 취소한 계정이 바꾼 것으로 상태 이력을 남기며, OCCUPIED(이용중), MAINTENANCE(정비중), VACANT(공실)이면 그대로 둡니다. 성공하면 취소 정보(cancellation)가 담긴 이용을 돌려줍니다. 없는 id와 다른 호텔의 이용 id는 모두 404 STAY_NOT_FOUND로 응답합니다. 사유가 200자를 넘으면 400 INVALID_INPUT으로 응답하고 fieldErrors에 reason을 담습니다.
openapi.schema.StayCancelHotelAdminRequest.reason=취소 사유(선택). 앞뒤 공백을 지운 뒤 200자 이하. 없거나 비었거나 공백만 있으면 사유 없이(null) 기록합니다.
openapi.schema.StayHotelAdminResponse.id=이용 ID
openapi.schema.StayHotelAdminResponse.room=객실(조회 시점의 이름)
openapi.schema.StayHotelAdminResponse.guest=이용객(조회 시점의 이름과 전화번호)
openapi.schema.StayHotelAdminResponse.checkInDate=체크인 날짜("YYYY-MM-DD")
openapi.schema.StayHotelAdminResponse.checkOutDate=체크아웃 날짜("YYYY-MM-DD"). 이 날은 묵지 않습니다.
openapi.schema.StayHotelAdminResponse.guestCount=인원
openapi.schema.StayHotelAdminResponse.roomRate=예약할 때의 1박 요금(원). 나중에 유형의 요금이 바뀌어도 그대로입니다.
openapi.schema.StayHotelAdminResponse.nights=박 수(체크아웃 날짜 - 체크인 날짜)
openapi.schema.StayHotelAdminResponse.baseAmount=기본 금액(원). 1박 요금 × 박 수
openapi.schema.StayHotelAdminResponse.discountAmount=할인 금액(원). 지금은 항상 0입니다.
