openapi.app-admin.tag.account=전체 어드민 계정과 로그인
openapi.app-admin.operation.login.summary=로그인
openapi.app-admin.operation.login.description=전체 어드민 계정으로 로그인합니다. 로그인하지 않아도 호출할 수 있지만 CSRF 토큰이 필요합니다. 어드민 API 응답으로 받은 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 보냅니다. 처음이라면 내 정보 조회의 401 응답에서 쿠키를 받습니다. 성공하면 새 세션 쿠키와 새 XSRF-TOKEN 쿠키가 발급되고, 이전 토큰은 더 이상 쓸 수 없습니다. 아이디가 없거나 비밀번호가 틀리면 같은 401 INVALID_CREDENTIALS로 응답합니다.
openapi.app-admin.operation.logout.summary=로그아웃
openapi.app-admin.operation.logout.description=세션을 끝내고 세션 쿠키와 XSRF-TOKEN 쿠키를 지웁니다. data는 항상 null입니다. 다음 로그인 전에는 어드민 API 응답(예: 내 정보 조회의 401)에서 새 XSRF-TOKEN 쿠키를 받습니다.
openapi.app-admin.operation.getMe.summary=내 정보 조회
openapi.app-admin.operation.getMe.description=로그인한 전체 어드민의 정보를 조회합니다. 로그인 상태 확인에 씁니다. 로그인하지 않았으면 401 UNAUTHORIZED와 함께 XSRF-TOKEN 쿠키를 발급합니다.
openapi.schema.AccountLoginAppAdminRequest.loginId=로그인 아이디(이메일). 앞뒤 공백과 대소문자는 구분하지 않습니다.
openapi.schema.AccountLoginAppAdminRequest.password=비밀번호
openapi.schema.AccountAppAdminResponse.id=전체 어드민 ID
openapi.schema.AccountAppAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountAppAdminResponse.name=이름
openapi.hotel-admin.tag.account=호텔 계정과 로그인
openapi.hotel-admin.operation.login.summary=로그인
openapi.hotel-admin.operation.login.description=호텔 계정(마스터·운영자)으로 로그인합니다. 로그인하지 않아도 호출할 수 있지만 CSRF 토큰이 필요합니다. 호텔 운영자 API 응답으로 받은 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 보냅니다. 처음이라면 내 정보 조회의 401 응답에서 쿠키를 받습니다. 성공하면 새 세션 쿠키와 새 XSRF-TOKEN 쿠키가 발급되고, 이전 토큰은 더 이상 쓸 수 없습니다. 아이디가 없거나, 비밀번호가 틀리거나, 비활성 계정이면 모두 같은 401 INVALID_CREDENTIALS로 응답합니다. 전체 어드민 계정으로는 로그인할 수 없습니다.
openapi.hotel-admin.operation.logout.summary=로그아웃
openapi.hotel-admin.operation.logout.description=세션을 끝내고 세션 쿠키와 XSRF-TOKEN 쿠키를 지웁니다. data는 항상 null입니다. 다음 로그인 전에는 호텔 운영자 API 응답(예: 내 정보 조회의 401)에서 새 XSRF-TOKEN 쿠키를 받습니다.
openapi.hotel-admin.operation.getMe.summary=내 정보 조회
openapi.hotel-admin.operation.getMe.description=로그인한 호텔 계정과 소속 호텔의 현재 정보를 조회합니다. 이름과 호텔 이름은 로그인할 때가 아니라 지금 저장된 값입니다. 로그인 상태 확인에 씁니다. 로그인하지 않았으면 401 UNAUTHORIZED와 함께 XSRF-TOKEN 쿠키를 발급합니다. 서버는 호텔 운영자 API 요청마다 계정을 다시 확인합니다. 로그인한 뒤 계정이 비활성화되거나, 비밀번호가 재설정되거나, 아이디가 바뀌었으면 세션을 끊고 401 UNAUTHORIZED로 응답하므로 다시 로그인합니다. 이름만 바뀐 경우는 세션을 유지합니다.
openapi.schema.AccountLoginHotelAdminRequest.loginId=로그인 아이디(이메일). 앞뒤 공백과 대소문자는 구분하지 않습니다.
openapi.schema.AccountLoginHotelAdminRequest.password=비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 비교합니다.
openapi.schema.AccountHotelAdminResponse.id=호텔 계정 ID
openapi.schema.AccountHotelAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountHotelAdminResponse.name=이름
openapi.schema.AccountHotelAdminResponse.role=역할. MASTER(마스터) 또는 OPERATOR(운영자)
openapi.schema.AccountHotelAdminResponse.hotel=소속 호텔
openapi.schema.AccountHotelHotelAdminResponse.id=호텔 ID
openapi.schema.AccountHotelHotelAdminResponse.name=호텔 이름
openapi.app-admin.tag.hotel=호텔 등록·조회·수정
openapi.app-admin.operation.createHotel.summary=호텔 등록
openapi.app-admin.operation.createHotel.description=호텔과 그 호텔의 마스터 계정을 함께 등록합니다. 둘 다 저장되거나 둘 다 저장되지 않습니다. 마스터 비밀번호를 뺀 모든 값은 앞뒤 공백을 지운 뒤 검사하고 저장하며, 최대 길이도 지운 값으로 셉니다. 공백만 있는 값은 빈 값으로 봅니다. 비밀번호는 입력한 그대로 검사하고 저장합니다. 이름과 주소가 모두 같은 호텔(앞뒤 공백을 지운 값을 대소문자까지 그대로 비교)이 이미 있으면 409 HOTEL_DUPLICATED로, 마스터 아이디를 다른 호텔 계정이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 둘 다 해당하면 HOTEL_DUPLICATED입니다. 같은 요청이 동시에 여러 번 와도 하나만 등록되고 나머지는 409 HOTEL_DUPLICATED이며, 서로 다른 호텔을 같은 마스터 아이디로 동시에 등록해도 하나만 등록되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 응답은 등록한 호텔이고 마스터 계정은 담지 않습니다. 등록한 호텔의 version은 0입니다.
openapi.app-admin.operation.getHotels.summary=호텔 목록 조회
openapi.app-admin.operation.getHotels.description=호텔 목록을 최근 등록 순(id 내림차순)으로 페이지로 나눠 조회합니다. keyword를 보내면 이름에 keyword가 들어 있는 호텔만 대소문자 구분 없이 찾습니다. %, _, \\ 같은 문자도 글자 그대로 찾습니다. keyword는 앞뒤 공백을 지운 뒤 100자 이하이고, 없거나 비어 있거나 공백만 있으면 전체를 조회합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. totalElements와 totalPages는 검색 결과 기준이며, totalPages가 100을 넘어도 page는 99까지만 받으므로 그 뒤의 호텔은 keyword로 좁혀 찾습니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.app-admin.operation.getHotels.parameter.keyword=이름 검색어(선택). 이름에 들어 있는 호텔을 대소문자 구분 없이 글자 그대로 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 전체를 조회합니다.
openapi.app-admin.operation.getHotels.parameter.page=페이지 번호. 0~99, 기본 0
openapi.app-admin.operation.getHotels.parameter.size=페이지 크기. 1~100, 기본 10
openapi.app-admin.operation.getHotel.summary=호텔 상세 조회
openapi.app-admin.operation.getHotel.description=호텔 하나를 조회합니다. 수정 요청에 보낼 version이 함께 옵니다. 호텔이 없으면 404 HOTEL_NOT_FOUND로 응답합니다.
openapi.app-admin.operation.updateHotel.summary=호텔 수정
openapi.app-admin.operation.updateHotel.description=호텔의 모든 항목을 요청 값으로 바꿉니다. 입력값 규칙은 등록과 같습니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 수정해 version이 다르면 409 HOTEL_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 HOTEL_MODIFIED입니다. 다른 호텔과 이름·주소가 모두 같아지면 409 HOTEL_DUPLICATED로 응답합니다. 이름과 주소를 그대로 두는 수정은 됩니다. 성공하면 최신 version을 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 호텔이 없으면 404 HOTEL_NOT_FOUND로 응답합니다.
openapi.schema.HotelCreateAppAdminRequest.name=호텔 이름. 앞뒤 공백을 지운 뒤 1~100자. 이름이 같은 호텔이 여러 개 있어도 됩니다.
openapi.schema.HotelCreateAppAdminRequest.address=주소(한 줄). 앞뒤 공백을 지운 뒤 1~200자. 이름과 주소가 모두 같은 호텔은 등록할 수 없습니다.
openapi.schema.HotelCreateAppAdminRequest.phone=대표 전화번호. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다.
openapi.schema.HotelCreateAppAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.HotelCreateAppAdminRequest.master=호텔 마스터 계정. 호텔과 함께 만듭니다.
openapi.schema.HotelMasterCreateAppAdminRequest.loginId=마스터 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다.소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다.
openapi.schema.HotelMasterCreateAppAdminRequest.name=마스터 이름. 앞뒤 공백을 지운 뒤 1~50자.
openapi.schema.HotelMasterCreateAppAdminRequest.password=처음 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.schema.HotelUpdateAppAdminRequest.name=호텔 이름. 앞뒤 공백을 지운 뒤 1~100자. 이름이 같은 호텔이 여러 개 있어도 됩니다.
openapi.schema.HotelUpdateAppAdminRequest.address=주소(한 줄). 앞뒤 공백을 지운 뒤 1~200자. 다른 호텔과 이름·주소가 모두 같아지면 수정할 수 없습니다.
openapi.schema.HotelUpdateAppAdminRequest.phone=대표 전화번호. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다.
openapi.schema.HotelUpdateAppAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.HotelUpdateAppAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 HOTEL_MODIFIED입니다.
openapi.schema.HotelAppAdminResponse.id=호텔 ID
openapi.schema.HotelAppAdminResponse.name=호텔 이름
openapi.schema.HotelAppAdminResponse.address=주소
openapi.schema.HotelAppAdminResponse.phone=대표 전화번호(입력한 모양 그대로)
openapi.schema.HotelAppAdminResponse.description=소개. 없으면 null
openapi.schema.HotelAppAdminResponse.version=버전. 값이 바뀌어 저장될 때마다 커집니다. 수정 요청에 그대로 보냅니다.
openapi.schema.PageResponse.items=현재 페이지의 항목
openapi.schema.PageResponse.page=현재 페이지 번호(0부터)
openapi.schema.PageResponse.size=페이지 크기(요청한 size)
openapi.schema.PageResponse.totalElements=전체 항목 수
openapi.schema.PageResponse.totalPages=전체 페이지 수
