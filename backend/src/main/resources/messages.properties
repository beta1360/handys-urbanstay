openapi.app.tag.hotel=호텔 목록(게스트 앱)
openapi.app.operation.getHotels.summary=호텔 목록 조회
openapi.app.operation.getHotels.description=게스트 앱에서 예약할 호텔을 고르는 목록을 페이지로 나눠 조회합니다. 로그인과 CSRF 토큰 없이 호출합니다. 모든 호텔을 보여주고(게스트 앱 노출 설정은 없습니다) 항목마다 그 호텔의 객실 수(roomCount)를 담습니다. 객실이 하나라도 있는 호텔이 먼저, 객실이 없는 호텔(roomCount 0)이 뒤에 오고, 각 묶음 안에서는 이름 오름차순, 같으면 호텔 id 오름차순으로 놓입니다. 페이지는 이 순서 전체를 나눈 것이라 객실이 있는 호텔이 모두 나온 뒤에 객실이 없는 호텔이 나옵니다. 객실이 없는 호텔은 예약할 객실 유형이 없으므로 화면에서 고를 수 없게 보여줍니다. 이름은 DB 기본 정렬 규칙으로 비교하므로 이름 속 숫자는 숫자 크기가 아니라 글자 순서로 비교합니다(예: 1001호점이 101호점보다 앞). 그래서 객실 목록의 이름순(숫자 크기로 비교)과 다를 수 있습니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.app.operation.getHotels.parameter.page=페이지 번호. 0~99, 기본 0
openapi.app.operation.getHotels.parameter.size=페이지 크기. 1~100, 기본 10
