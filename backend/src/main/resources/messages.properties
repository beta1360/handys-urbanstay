openapi.app-admin.tag.account=전체 어드민 계정과 로그인, 호텔 마스터 계정 관리
openapi.app-admin.operation.login.summary=로그인
openapi.app-admin.operation.login.description=전체 어드민 계정으로 로그인합니다. 로그인하지 않아도 호출할 수 있지만 CSRF 토큰이 필요합니다. 어드민 API 응답으로 받은 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 보냅니다. 처음이라면 내 정보 조회의 401 응답에서 쿠키를 받습니다. 성공하면 새 세션 쿠키와 새 XSRF-TOKEN 쿠키가 발급되고, 이전 토큰은 더 이상 쓸 수 없습니다. 아이디가 없거나 비밀번호가 틀리면 같은 401 INVALID_CREDENTIALS로 응답합니다.
openapi.app-admin.operation.logout.summary=로그아웃
openapi.app-admin.operation.logout.description=세션을 끝내고 세션 쿠키와 XSRF-TOKEN 쿠키를 지웁니다. data는 항상 null입니다. 다음 로그인 전에는 어드민 API 응답(예: 내 정보 조회의 401)에서 새 XSRF-TOKEN 쿠키를 받습니다.
openapi.app-admin.operation.getMe.summary=내 정보 조회
openapi.app-admin.operation.getMe.description=로그인한 전체 어드민의 정보를 조회합니다. 로그인 상태 확인에 씁니다. 로그인하지 않았으면 401 UNAUTHORIZED와 함께 XSRF-TOKEN 쿠키를 발급합니다.
openapi.schema.AccountLoginAppAdminRequest.loginId=로그인 아이디(이메일). 앞뒤 공백과 대소문자는 구분하지 않습니다.
openapi.schema.AccountLoginAppAdminRequest.password=비밀번호
openapi.schema.AccountAppAdminResponse.id=전체 어드민 ID
openapi.schema.AccountAppAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountAppAdminResponse.name=이름
openapi.hotel-admin.tag.account=호텔 계정과 로그인, 운영자 계정 관리(마스터 전용)
openapi.hotel-admin.operation.login.summary=로그인
openapi.hotel-admin.operation.login.description=호텔 계정(마스터·운영자)으로 로그인합니다. 로그인하지 않아도 호출할 수 있지만 CSRF 토큰이 필요합니다. 호텔 운영자 API 응답으로 받은 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 보냅니다. 처음이라면 내 정보 조회의 401 응답에서 쿠키를 받습니다. 성공하면 새 세션 쿠키와 새 XSRF-TOKEN 쿠키가 발급되고, 이전 토큰은 더 이상 쓸 수 없습니다. 아이디가 없거나, 비밀번호가 틀리거나, 비활성 계정이면 모두 같은 401 INVALID_CREDENTIALS로 응답합니다. 전체 어드민 계정으로는 로그인할 수 없습니다.
openapi.hotel-admin.operation.logout.summary=로그아웃
openapi.hotel-admin.operation.logout.description=세션을 끝내고 세션 쿠키와 XSRF-TOKEN 쿠키를 지웁니다. data는 항상 null입니다. 다음 로그인 전에는 호텔 운영자 API 응답(예: 내 정보 조회의 401)에서 새 XSRF-TOKEN 쿠키를 받습니다.
openapi.hotel-admin.operation.getMe.summary=내 정보 조회
openapi.hotel-admin.operation.getMe.description=로그인한 호텔 계정과 소속 호텔의 현재 정보를 조회합니다. 이름과 호텔 이름은 로그인할 때가 아니라 지금 저장된 값입니다. 로그인 상태 확인에 씁니다. 로그인하지 않았으면 401 UNAUTHORIZED와 함께 XSRF-TOKEN 쿠키를 발급합니다. 서버는 호텔 운영자 API 요청마다 계정을 다시 확인합니다. 로그인한 뒤 계정이 비활성화되거나, 비밀번호가 재설정되거나, 아이디가 바뀌었으면 세션을 끊고 401 UNAUTHORIZED로 응답하므로 다시 로그인합니다. 이름만 바뀐 경우는 세션을 유지합니다.
openapi.schema.AccountLoginHotelAdminRequest.loginId=로그인 아이디(이메일). 앞뒤 공백과 대소문자는 구분하지 않습니다.
openapi.schema.AccountLoginHotelAdminRequest.password=비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 비교합니다.
openapi.schema.AccountHotelAdminResponse.id=호텔 계정 ID
openapi.schema.AccountHotelAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountHotelAdminResponse.name=이름
openapi.schema.AccountHotelAdminResponse.role=역할. MASTER(마스터) 또는 OPERATOR(운영자)
openapi.schema.AccountHotelAdminResponse.hotel=소속 호텔
openapi.schema.AccountHotelHotelAdminResponse.id=호텔 ID
openapi.schema.AccountHotelHotelAdminResponse.name=호텔 이름
openapi.app-admin.tag.hotel=호텔 등록·조회·수정
openapi.app-admin.operation.createHotel.summary=호텔 등록
openapi.app-admin.operation.createHotel.description=호텔과 그 호텔의 마스터 계정을 함께 등록합니다. 둘 다 저장되거나 둘 다 저장되지 않습니다. 마스터 비밀번호를 뺀 모든 값은 앞뒤 공백을 지운 뒤 검사하고 저장하며, 최대 길이도 지운 값으로 셉니다. 공백만 있는 값은 빈 값으로 봅니다. 비밀번호는 입력한 그대로 검사하고 저장합니다. 이름과 주소가 모두 같은 호텔(앞뒤 공백을 지운 값을 대소문자까지 그대로 비교)이 이미 있으면 409 HOTEL_DUPLICATED로, 마스터 아이디를 다른 호텔 계정이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 둘 다 해당하면 HOTEL_DUPLICATED입니다. 같은 요청이 동시에 여러 번 와도 하나만 등록되고 나머지는 409 HOTEL_DUPLICATED이며, 서로 다른 호텔을 같은 마스터 아이디로 동시에 등록해도 하나만 등록되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 응답은 등록한 호텔이고 마스터 계정은 담지 않습니다. 등록한 호텔의 version은 0입니다.
openapi.app-admin.operation.getHotels.summary=호텔 목록 조회
openapi.app-admin.operation.getHotels.description=호텔 목록을 최근 등록 순(id 내림차순)으로 페이지로 나눠 조회합니다. keyword를 보내면 이름에 keyword가 들어 있는 호텔만 대소문자 구분 없이 찾습니다. %, _, \\ 같은 문자도 글자 그대로 찾습니다. keyword는 앞뒤 공백을 지운 뒤 100자 이하이고, 없거나 비어 있거나 공백만 있으면 전체를 조회합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. totalElements와 totalPages는 검색 결과 기준이며, totalPages가 100을 넘어도 page는 99까지만 받으므로 그 뒤의 호텔은 keyword로 좁혀 찾습니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.app-admin.operation.getHotels.parameter.keyword=이름 검색어(선택). 이름에 들어 있는 호텔을 대소문자 구분 없이 글자 그대로 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 전체를 조회합니다.
openapi.app-admin.operation.getHotels.parameter.page=페이지 번호. 0~99, 기본 0
openapi.app-admin.operation.getHotels.parameter.size=페이지 크기. 1~100, 기본 10
openapi.app-admin.operation.getHotel.summary=호텔 상세 조회
openapi.app-admin.operation.getHotel.description=호텔 하나를 조회합니다. 수정 요청에 보낼 version이 함께 옵니다. 호텔이 없으면 404 HOTEL_NOT_FOUND로 응답합니다.
openapi.app-admin.operation.updateHotel.summary=호텔 수정
openapi.app-admin.operation.updateHotel.description=호텔의 모든 항목을 요청 값으로 바꿉니다. 입력값 규칙은 등록과 같습니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 수정해 version이 다르면 409 HOTEL_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 HOTEL_MODIFIED입니다. 다른 호텔과 이름·주소가 모두 같아지면 409 HOTEL_DUPLICATED로 응답합니다. 이름과 주소를 그대로 두는 수정은 됩니다. 성공하면 최신 version을 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 호텔이 없으면 404 HOTEL_NOT_FOUND로 응답합니다.
openapi.schema.HotelCreateAppAdminRequest.name=호텔 이름. 앞뒤 공백을 지운 뒤 1~100자. 이름이 같은 호텔이 여러 개 있어도 됩니다.
openapi.schema.HotelCreateAppAdminRequest.address=주소(한 줄). 앞뒤 공백을 지운 뒤 1~200자. 이름과 주소가 모두 같은 호텔은 등록할 수 없습니다.
openapi.schema.HotelCreateAppAdminRequest.phone=대표 전화번호. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다.
openapi.schema.HotelCreateAppAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.HotelCreateAppAdminRequest.master=호텔 마스터 계정. 호텔과 함께 만듭니다.
openapi.schema.HotelMasterCreateAppAdminRequest.loginId=마스터 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다.소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다.
openapi.schema.HotelMasterCreateAppAdminRequest.name=마스터 이름. 앞뒤 공백을 지운 뒤 1~50자.
openapi.schema.HotelMasterCreateAppAdminRequest.password=처음 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.schema.HotelUpdateAppAdminRequest.name=호텔 이름. 앞뒤 공백을 지운 뒤 1~100자. 이름이 같은 호텔이 여러 개 있어도 됩니다.
openapi.schema.HotelUpdateAppAdminRequest.address=주소(한 줄). 앞뒤 공백을 지운 뒤 1~200자. 다른 호텔과 이름·주소가 모두 같아지면 수정할 수 없습니다.
openapi.schema.HotelUpdateAppAdminRequest.phone=대표 전화번호. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다.
openapi.schema.HotelUpdateAppAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.HotelUpdateAppAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 HOTEL_MODIFIED입니다.
openapi.schema.HotelAppAdminResponse.id=호텔 ID
openapi.schema.HotelAppAdminResponse.name=호텔 이름
openapi.schema.HotelAppAdminResponse.address=주소
openapi.schema.HotelAppAdminResponse.phone=대표 전화번호(입력한 모양 그대로)
openapi.schema.HotelAppAdminResponse.description=소개. 없으면 null
openapi.schema.HotelAppAdminResponse.version=버전. 값이 바뀌어 저장될 때마다 커집니다. 수정 요청에 그대로 보냅니다.
openapi.schema.PageResponse.items=현재 페이지의 항목
openapi.schema.PageResponse.page=현재 페이지 번호(0부터)
openapi.schema.PageResponse.size=페이지 크기(요청한 size)
openapi.schema.PageResponse.totalElements=전체 항목 수
openapi.schema.PageResponse.totalPages=전체 페이지 수
openapi.app-admin.operation.getHotelMaster.summary=호텔 마스터 조회
openapi.app-admin.operation.getHotelMaster.description=호텔의 마스터 계정을 조회합니다. 비밀번호는 주지 않습니다. 정보 수정 요청에 보낼 version이 함께 옵니다. 호텔이 없으면 404 HOTEL_NOT_FOUND로, 호텔은 있는데 마스터가 없으면 404 HOTEL_MASTER_NOT_FOUND로 응답합니다.
openapi.app-admin.operation.updateHotelMaster.summary=호텔 마스터 정보 수정
openapi.app-admin.operation.updateHotelMaster.description=호텔 마스터의 아이디와 이름을 요청 값으로 바꿉니다. 입력값 규칙은 호텔 등록의 마스터와 같습니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 정보를 수정하거나 비밀번호를 재설정해 version이 다르면 409 HOTEL_ADMIN_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 HOTEL_ADMIN_MODIFIED입니다. 아이디를 다른 호텔 계정(마스터·운영자)이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 자기 아이디를 대소문자나 앞뒤 공백만 바꿔 보내면 같은 아이디라 중복이 아닙니다. version이 다르면서 아이디도 겹치면 HOTEL_ADMIN_MODIFIED입니다. 서로 다른 마스터를 같은 새 아이디로 동시에 바꿔도 하나만 반영되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 아이디가 실제로 바뀌면(소문자로 바꾼 값이 지금과 다르면) 그 마스터가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊기고, 마스터는 새 아이디로 다시 로그인합니다. 이름만 바꾸거나 대소문자·앞뒤 공백만 다른 같은 아이디를 보내면 세션은 유지됩니다. 성공하면 수정한 마스터를 최신 version과 함께 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 호텔이 없으면 404 HOTEL_NOT_FOUND, 호텔은 있는데 마스터가 없으면 404 HOTEL_MASTER_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelMasterUpdateAppAdminRequest.loginId=마스터 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다. 소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다. 실제로 바뀌면 마스터의 기존 로그인 세션이 끊깁니다.
openapi.schema.AccountHotelMasterUpdateAppAdminRequest.name=마스터 이름. 앞뒤 공백을 지운 뒤 1~50자. 바꿔도 마스터의 로그인 세션은 유지됩니다.
openapi.schema.AccountHotelMasterUpdateAppAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 HOTEL_ADMIN_MODIFIED입니다.
openapi.schema.AccountHotelMasterAppAdminResponse.id=호텔 마스터 계정 ID
openapi.schema.AccountHotelMasterAppAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountHotelMasterAppAdminResponse.name=이름
openapi.schema.AccountHotelMasterAppAdminResponse.version=버전. 정보 수정이나 비밀번호 재설정으로 마스터 계정이 바뀌어 저장될 때마다 커집니다. 정보 수정 요청에 그대로 보냅니다.
openapi.app-admin.operation.resetHotelMasterPassword.summary=호텔 마스터 비밀번호 재설정
openapi.app-admin.operation.resetHotelMasterPassword.description=호텔 마스터의 비밀번호를 새 비밀번호로 바꿉니다. 비밀번호 규칙은 호텔 등록의 마스터 처음 비밀번호와 같고, 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 지금과 같은 비밀번호로도 재설정할 수 있습니다. version은 보내지 않습니다. 성공하면 data는 null입니다. 재설정하면 같은 비밀번호로 바꿨더라도 그 마스터가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊기고, 마스터는 새 비밀번호로 다시 로그인합니다. 재설정도 마스터 계정을 바꾸므로 version이 1 커집니다. 그래서 재설정 전에 조회한 version으로 정보를 수정하면 409 HOTEL_ADMIN_MODIFIED이므로 다시 조회한 뒤 수정합니다. 같은 마스터의 정보 수정이나 다른 재설정과 동시에 처리되면 늦은 쪽이 409 HOTEL_ADMIN_MODIFIED일 수 있고, 이때 비밀번호는 바뀌지 않았으므로 다시 시도합니다. 호텔이 없으면 404 HOTEL_NOT_FOUND, 호텔은 있는데 마스터가 없으면 404 HOTEL_MASTER_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelMasterPasswordResetAppAdminRequest.password=새 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.hotel-admin.operation.createHotelOperator.summary=운영자 등록
openapi.hotel-admin.operation.createHotelOperator.description=로그인한 마스터의 호텔에 운영자 계정을 등록합니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. 아이디와 이름은 앞뒤 공백을 지운 뒤 검사하고 저장하며, 최대 길이도 지운 값으로 셉니다. 공백만 있는 값은 빈 값으로 봅니다. 비밀번호는 입력한 그대로 검사하고 저장합니다. 등록한 운영자는 활성 상태이고 version은 0이며, 바로 호텔 운영자 앱에 로그인할 수 있습니다. 아이디를 다른 호텔 계정(마스터·운영자, 다른 호텔과 비활성 계정 포함)이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 같은 아이디로 동시에 여러 번 등록해도 하나만 등록되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 응답은 등록한 운영자입니다.
openapi.hotel-admin.operation.getHotelOperators.summary=운영자 목록 조회
openapi.hotel-admin.operation.getHotelOperators.description=로그인한 마스터의 호텔에 속한 운영자 목록을 최근 등록 순(id 내림차순)으로 페이지로 나눠 조회합니다. 마스터 자신과 다른 호텔의 계정은 나오지 않습니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. active를 보내지 않으면 활성·비활성 운영자를 모두, true면 활성 운영자만, false면 비활성 운영자만 조회합니다. keyword를 보내면 이름이나 아이디에 keyword가 들어 있는 운영자만 대소문자 구분 없이 찾습니다. %, _, \ 같은 문자도 글자 그대로 찾습니다. keyword는 앞뒤 공백을 지운 뒤 100자 이하이고, 없거나 비어 있거나 공백만 있으면 거르지 않습니다. keyword와 active를 함께 보내면 둘 다 맞는 운영자만 조회합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. totalElements와 totalPages는 조건에 맞는 결과 기준이며, totalPages가 100을 넘어도 page는 99까지만 받으므로 그 뒤의 운영자는 keyword로 좁혀 찾습니다. 범위를 벗어나거나 active가 소문자 true나 false가 아니면(빈 값, 대문자, 1·0 포함) 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.hotel-admin.operation.getHotelOperators.parameter.keyword=검색어(선택). 이름이나 아이디에 들어 있는 운영자를 대소문자 구분 없이 글자 그대로 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 거르지 않습니다.
openapi.hotel-admin.operation.getHotelOperators.parameter.active=활성 여부(선택). 소문자 true면 활성 운영자만, false면 비활성 운영자만 조회합니다. 보내지 않으면 모두 조회하고, 그 밖의 값(빈 값 포함)은 400 INVALID_INPUT입니다.
openapi.hotel-admin.operation.getHotelOperators.parameter.page=페이지 번호. 0~99, 기본 0
openapi.hotel-admin.operation.getHotelOperators.parameter.size=페이지 크기. 1~100, 기본 10
openapi.hotel-admin.operation.getHotelOperator.summary=운영자 조회
openapi.hotel-admin.operation.getHotelOperator.description=로그인한 마스터의 호텔에 속한 운영자 하나를 조회합니다. 비밀번호는 주지 않습니다. 정보 수정 요청에 보낼 version이 함께 옵니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. 없는 id, 다른 호텔의 계정, 마스터 자신의 id는 모두 404 HOTEL_OPERATOR_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelOperatorCreateHotelAdminRequest.loginId=운영자 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다. 소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자, 비활성 계정 포함)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다.
openapi.schema.AccountHotelOperatorCreateHotelAdminRequest.name=운영자 이름. 앞뒤 공백을 지운 뒤 1~50자.
openapi.schema.AccountHotelOperatorCreateHotelAdminRequest.password=처음 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.schema.AccountHotelOperatorHotelAdminResponse.id=운영자 계정 ID
openapi.schema.AccountHotelOperatorHotelAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountHotelOperatorHotelAdminResponse.name=이름
openapi.schema.AccountHotelOperatorHotelAdminResponse.active=활성 여부. false면 호텔 운영자 앱에 로그인할 수 없습니다.
openapi.schema.AccountHotelOperatorHotelAdminResponse.version=버전. 정보 수정, 비밀번호 재설정, 활성 상태 변경으로 운영자 계정이 바뀌어 저장될 때마다 커집니다. 정보 수정 요청에 그대로 보냅니다.
openapi.hotel-admin.operation.updateHotelOperator.summary=운영자 정보 수정
openapi.hotel-admin.operation.updateHotelOperator.description=로그인한 마스터의 호텔에 속한 운영자의 아이디와 이름을 요청 값으로 바꿉니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. 입력값 규칙은 운영자 등록과 같습니다. 비활성 운영자도 수정할 수 있습니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 정보를 수정하거나, 비밀번호를 재설정하거나, 활성 상태를 바꿔 version이 다르면 409 HOTEL_ADMIN_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 HOTEL_ADMIN_MODIFIED입니다. 아이디를 다른 호텔 계정(마스터·운영자, 다른 호텔과 비활성 계정 포함)이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 자기 아이디를 대소문자나 앞뒤 공백만 바꿔 보내면 같은 아이디라 중복이 아닙니다. version이 다르면서 아이디도 겹치면 HOTEL_ADMIN_MODIFIED입니다. 서로 다른 운영자를 같은 새 아이디로 동시에 바꿔도 하나만 반영되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 아이디가 실제로 바뀌면(소문자로 바꾼 값이 지금과 다르면) 그 운영자가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊기고, 운영자는 새 아이디로 다시 로그인합니다. 이름만 바꾸거나 대소문자·앞뒤 공백만 다른 같은 아이디를 보내면 세션은 유지됩니다. 마스터 자신의 세션은 영향을 받지 않습니다. 성공하면 수정한 운영자를 최신 version과 함께 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 없는 id, 다른 호텔의 계정, 마스터 자신의 id는 모두 404 HOTEL_OPERATOR_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelOperatorUpdateHotelAdminRequest.loginId=운영자 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다. 소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자, 비활성 계정 포함)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다. 실제로 바뀌면 운영자의 기존 로그인 세션이 끊깁니다.
openapi.schema.AccountHotelOperatorUpdateHotelAdminRequest.name=운영자 이름. 앞뒤 공백을 지운 뒤 1~50자. 바꿔도 운영자의 로그인 세션은 유지됩니다.
openapi.schema.AccountHotelOperatorUpdateHotelAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 HOTEL_ADMIN_MODIFIED입니다.
openapi.hotel-admin.operation.resetHotelOperatorPassword.summary=운영자 비밀번호 재설정
openapi.hotel-admin.operation.resetHotelOperatorPassword.description=로그인한 마스터의 호텔에 속한 운영자의 비밀번호를 새 비밀번호로 바꿉니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. 비밀번호 규칙은 운영자 등록의 처음 비밀번호와 같고, 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 지금과 같은 비밀번호로도 재설정할 수 있고, 비활성 운영자도 재설정할 수 있습니다(로그인은 다시 활성화한 뒤에 할 수 있습니다). version은 보내지 않습니다. 성공하면 data는 null입니다. 재설정하면 같은 비밀번호로 바꿨더라도 그 운영자가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊기고, 운영자는 새 비밀번호로 다시 로그인합니다. 마스터 자신의 세션은 영향을 받지 않습니다. 재설정도 운영자 계정을 바꾸므로 version이 1 커집니다. 그래서 재설정 전에 조회한 version으로 정보를 수정하면 409 HOTEL_ADMIN_MODIFIED이므로 다시 조회한 뒤 수정합니다. 같은 운영자의 다른 변경과 동시에 처리되면 늦은 쪽이 409 HOTEL_ADMIN_MODIFIED일 수 있고, 이때 비밀번호는 바뀌지 않았으므로 다시 시도합니다. 없는 id, 다른 호텔의 계정, 마스터 자신의 id는 모두 404 HOTEL_OPERATOR_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelOperatorPasswordResetHotelAdminRequest.password=새 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.hotel-admin.operation.updateHotelOperatorActive.summary=운영자 활성 상태 변경
openapi.hotel-admin.operation.updateHotelOperatorActive.description=로그인한 마스터의 호텔에 속한 운영자를 비활성화하거나 다시 활성화합니다. 운영자 계정은 지우지 않고 비활성화합니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. active를 false로 보내면 비활성화합니다. 비활성 운영자는 로그인할 수 없고(아이디나 비밀번호가 틀렸을 때와 같은 401 INVALID_CREDENTIALS), 그 운영자가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊깁니다. active를 true로 보내면 다시 활성화해 다시 로그인할 수 있습니다. 비활성화로 끊긴 세션은 다시 활성화해도 되살아나지 않으므로 새로 로그인합니다. 이미 요청한 상태이면 아무것도 바꾸지 않고 지금 운영자를 200으로 돌려주며 version도 그대로입니다. 마스터 자신의 세션은 영향을 받지 않습니다. version은 보내지 않습니다. 상태가 바뀌면 version이 1 커지므로, 그 전에 조회한 version으로 정보를 수정하면 409 HOTEL_ADMIN_MODIFIED이고 다시 조회한 뒤 수정합니다. 같은 운영자의 다른 변경과 동시에 처리되면 늦은 쪽이 409 HOTEL_ADMIN_MODIFIED일 수 있고, 이때 상태는 바뀌지 않았으므로 다시 시도합니다. 성공하면 운영자를 최신 version과 함께 돌려줍니다. 없는 id, 다른 호텔의 계정, 마스터 자신의 id는 모두 404 HOTEL_OPERATOR_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelOperatorActiveUpdateHotelAdminRequest.active=바꿀 활성 여부. false면 비활성화하고(기존 로그인 세션이 끊기고 로그인할 수 없음), true면 다시 활성화합니다. 지금과 같은 값이면 아무것도 바꾸지 않습니다.
