success.stay.reserved=예약을 완료했습니다.
openapi.app.tag.stay=객실 유형별 예약 가능 객실과 예약(게스트 앱)
openapi.app.operation.getHotelRoomTypes.summary=호텔의 객실 유형별 예약 가능 객실 조회
openapi.app.operation.getHotelRoomTypes.description=호텔 하나의 객실 유형 목록을 고른 기간과 인원으로 조회합니다. 로그인과 CSRF 토큰 없이 호출합니다. 객실 유형은 호텔 마스터가 만든 유형이고, 유형마다 이름, 최대 인원(capacity), 1박 요금(roomRate), 체크인·체크아웃 시각, 그 유형의 객실 수(roomCount), 그 기간과 인원으로 예약할 수 있는 객실 수(availableCount)를 담습니다. 예약할 수 있는 객실은 그 유형의 최대 인원이 guestCount 이상이고 그 기간에 취소하지 않은 이용과 겹치지 않는 객실이며, 객실 상태와는 관계없습니다. availableCount가 0이면 그 유형은 예약할 수 없습니다(화면의 '예약불가'). 객실이 없는 유형도 roomCount 0, availableCount 0으로 나옵니다. 기간은 날짜 단위로 체크인 날짜부터 체크아웃 날짜 전날까지 묵는 것으로 보므로, 체크아웃 날에 다른 이용이 체크인하는 것은 겹치지 않습니다(예: 11월 1일~3일과 3일~5일). 유형 이름 오름차순(같으면 id 오름차순)으로 놓입니다. 이름 속 숫자는 숫자 크기로 비교하고(예: 2인실, 10인실 순), 숫자로 시작하는 이름, 영문, 한글 순이며, 대소문자만 다른 이름은 소문자가 먼저입니다(예: deluxe, Deluxe). 한 호텔의 유형 수는 많지 않고 화면이 한 번에 모두 보여주므로 페이지로 나누지 않고 전부 돌려줍니다. 유형이 없는 호텔이면 빈 목록입니다. 세 파라미터는 모두 필수이고, 날짜는 "YYYY-MM-DD" 형식만 받습니다. 빠졌거나 형식이 틀렸거나 인원이 1보다 적으면 먼저 400 INVALID_INPUT으로 응답하고 fieldErrors에 그 파라미터 이름을 담습니다. 그다음 예약과 같은 기간 규칙(체크인 날짜는 오늘(한국 시간)이거나 그 뒤, 체크아웃 날짜는 체크인 날짜보다 뒤이고 최대 30박)을 어기면 400 INVALID_INPUT으로 응답하고 fieldErrors에 틀린 항목(checkInDate, checkOutDate)을 모두 담습니다. 없는 호텔이면 404 HOTEL_NOT_FOUND이고, 400 검사가 먼저입니다.
openapi.app.operation.getHotelRoomTypes.parameter.checkInDate=체크인 날짜("YYYY-MM-DD"). 오늘(한국 시간)이거나 그 뒤
openapi.app.operation.getHotelRoomTypes.parameter.checkOutDate=체크아웃 날짜("YYYY-MM-DD"). 체크인 날짜보다 뒤이고 최대 30박. 이 날은 묵지 않습니다.
openapi.app.operation.getHotelRoomTypes.parameter.guestCount=인원. 1 이상 정수
