openapi.schema.StayRoomTypeAppResponse.name=객실 유형 이름
openapi.schema.StayRoomTypeAppResponse.capacity=최대 인원. 이보다 많은 인원은 그 유형에 예약할 수 없습니다.
openapi.schema.StayRoomTypeAppResponse.roomRate=1박 요금(원)
openapi.schema.StayRoomTypeAppResponse.checkInTime=체크인 시각("HH:mm")
