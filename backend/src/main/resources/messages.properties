openapi.schema.StayRoomTypeAppResponse.roomCount=그 유형의 객실 수. 객실 상태와 예약에 관계없이 모두 셉니다.
openapi.schema.StayRoomTypeAppResponse.availableCount=고른 기간과 인원으로 예약할 수 있는 객실 수. 0이면 그 유형은 예약할 수 없습니다('예약불가').
openapi.app.operation.createStay.summary=예약
openapi.app.operation.createStay.description=로그인한 회원이 호텔의 객실 유형 하나를 기간과 인원으로 예약합니다. 회원 세션 쿠키로 호출하고 CSRF 토큰은 쓰지 않습니다. 로그인하지 않았으면 401 UNAUTHORIZED입니다. 게스트는 객실(호수)을 고르지 않습니다. 서버가 그 유형에서 예약할 수 있는 객실(그 기간에 취소하지 않은 이용과 겹치지 않는 객실, guestCount는 유형의 최대 인원 이하) 중 객실 이름순(이름 속 숫자는 숫자 크기로 비교, 같으면 객실 id순)으로 첫 객실을 배정하고, 응답에는 배정한 객실을 담지 않습니다. 객실 상태와 관계없이 배정하고, 예약해도 객실 상태는 바뀌지 않습니다. 같은 유형에 예약이 동시에 와도 한 객실에 기간이 겹치는 이용은 생기지 않습니다. 먼저 온 예약이 끝날 때까지 기다렸다가 남은 객실을 배정하고, 남은 객실이 없으면 409 ROOM_TYPE_UNAVAILABLE입니다. 이용객 정보는 보내지 않고 로그인한 회원의 정보를 씁니다. 그 호텔에 하이픈을 뺀 숫자가 회원 전화번호와 같은 이용객(예: 010-1234-5678과 01012345678)이 있으면 그 이용객으로 예약하고 회원과 연결하며, 그 이용객의 이름과 이메일은 바꾸지 않습니다(응답의 guest.name은 이미 있던 이용객의 이름입니다). 없으면 회원의 이름, 전화번호, 이메일로 그 호텔의 이용객을 새로 만들고 회원과 연결합니다. 그 이용객이 이미 다른 회원과 연결되어 있으면 409 GUEST_LINKED_TO_OTHER_MEMBER로 응답하고 예약하지 않습니다. 이용객과 이용은 함께 저장되거나 함께 저장되지 않습니다. 같은 새 이용객의 예약이 동시에 와도 이용객은 하나만 만들어집니다. 판단 순서는 로그인(401), 요청 형식(필수·형식·인원 1 이상, 400), 기간(400), 객실 유형(404), 예약할 수 있는 객실(409 ROOM_TYPE_UNAVAILABLE), 이용객 연결(409 GUEST_LINKED_TO_OTHER_MEMBER) 순입니다. 기간은 날짜 단위로 체크인 날짜부터 체크아웃 날짜 전날까지 묵는 것으로 보고(체크아웃 날은 비어 있음), 1박 이상 30박 이하이며 체크인 날짜는 오늘(한국 시간)이거나 그 뒤여야 합니다. 기간 규칙을 어기면 400 INVALID_INPUT으로 응답하고 fieldErrors에 틀린 항목(checkInDate, checkOutDate)을 모두 담습니다. 없는 유형이거나 그 호텔의 유형이 아니면(없는 호텔 포함) 404 ROOM_TYPE_NOT_FOUND로 응답합니다. 그 기간과 인원으로 예약할 수 있는 객실이 없으면(인원이 그 유형의 최대 인원보다 많을 때, 그 유형에 객실이 없을 때 포함) 409 ROOM_TYPE_UNAVAILABLE로 응답합니다. 취소한 이용과는 겹쳐도 되고, 체크아웃 날에 다른 이용이 체크인하는 것은 겹치지 않습니다(예: 11월 1일~3일과 3일~5일). 409 STAY_PERIOD_OVERLAPPED는 배정한 객실에 기간이 겹치는 이용이 DB 제약에 걸렸을 때의 안전망이며 보통은 나오지 않습니다. 예약할 때 그 유형의 1박 요금으로 금액을 계산해 이용에 저장합니다(기본 금액 = 1박 요금 × 박 수, 할인 금액은 지금 0, 최종 금액 = 기본 금액 - 할인 금액). 나중에 유형의 요금이 바뀌어도 저장한 금액은 그대로입니다. 성공하면 201과 함께 예약 내용(호텔, 객실 유형, 기간, 인원, 금액, 이용객 이름)을 돌려줍니다.
