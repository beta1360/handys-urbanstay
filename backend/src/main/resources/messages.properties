openapi.app.operation.signup.summary=회원가입
openapi.app.operation.signup.description=게스트 앱 회원으로 가입하고 바로 로그인합니다. 로그인과 CSRF 토큰 없이 호출합니다. 성공하면 201과 함께 가입한 회원 정보를 돌려주고 새 세션 쿠키가 발급되므로, 따로 로그인하지 않고 예약할 수 있습니다. 이메일은 모든 회원을 통틀어 유일하고 대소문자와 앞뒤 공백을 구분하지 않습니다(소문자로 바꿔 저장). 이미 가입한 이메일이면 409 MEMBER_EMAIL_DUPLICATED로 응답합니다. 같은 이메일로 동시에 가입해도 하나만 가입됩니다. 어드민 계정·호텔 계정과는 따로 저장하므로 같은 이메일을 써도 됩니다. 항목 규칙을 어기면 400 INVALID_INPUT으로 응답하고 fieldErrors에 틀린 항목을 모두 담습니다.
openapi.app.operation.login.summary=로그인
openapi.app.operation.login.description=회원 이메일과 비밀번호로 로그인합니다. 로그인과 CSRF 토큰 없이 호출합니다. 성공하면 회원 정보를 돌려주고 새 세션 쿠키가 발급됩니다(세션이 있었으면 세션 ID가 바뀝니다). 이메일은 대소문자와 앞뒤 공백을 구분하지 않습니다. 이메일이 없거나 비밀번호가 틀리면 같은 401 INVALID_CREDENTIALS로 응답합니다. 다른 API의 401 UNAUTHORIZED(로그인 필요)와 구분해서 처리합니다. 어드민 계정·호텔 계정으로는 로그인할 수 없습니다.
openapi.app.operation.logout.summary=로그아웃
openapi.app.operation.logout.description=로그인한 회원의 세션을 끝내고 세션 쿠키를 지웁니다. CSRF 토큰 없이 호출합니다. data는 항상 null입니다. 로그인하지 않았으면 401 UNAUTHORIZED로 응답합니다.
openapi.app.operation.getMe.summary=내 정보 조회
openapi.app.operation.getMe.description=로그인한 회원의 정보를 조회합니다. 로그인 상태 확인에 씁니다. 로그인하지 않았으면 401 UNAUTHORIZED로 응답합니다.
openapi.schema.MemberSignupAppRequest.email=이메일(로그인 아이디). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다. 소문자로 바꿔 저장합니다.
openapi.schema.MemberSignupAppRequest.password=비밀번호. 8~64자, 영문과 숫자를 모두 넣고 영문 자판의 글자(공백 포함)만 씁니다. 앞뒤 공백도 비밀번호에 넣습니다.
openapi.schema.MemberSignupAppRequest.name=이름. 앞뒤 공백을 지운 뒤 1~50자. 예약할 때 새 이용객의 이름으로 씁니다.
openapi.schema.MemberSignupAppRequest.phone=전화번호. 예: 010-1234-5678. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다. 예약할 때 그 호텔에서 하이픈을 뺀 숫자로 같은 이용객을 찾습니다.
openapi.schema.MemberLoginAppRequest.email=이메일. 앞뒤 공백과 대소문자는 구분하지 않습니다.
openapi.schema.MemberLoginAppRequest.password=비밀번호
