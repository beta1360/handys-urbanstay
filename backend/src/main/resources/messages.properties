openapi.schema.StayCreateAppRequest.checkInDate=체크인 날짜. "YYYY-MM-DD" 형식의 문자열. 오늘(한국 시간)이거나 그 뒤여야 합니다.
openapi.schema.StayCreateAppRequest.checkOutDate=체크아웃 날짜. "YYYY-MM-DD" 형식의 문자열. 체크인 날짜보다 뒤이고 체크인 날짜와 30일 이하로 차이 나야 합니다(최대 30박). 이 날은 묵지 않는 날로 봅니다.
openapi.schema.StayCreateAppRequest.guestCount=인원. 1 이상 정수. 그 유형의 최대 인원보다 많으면 예약할 수 없습니다(409 ROOM_TYPE_UNAVAILABLE).
