openapi.app-admin.operation.getMembers.summary=회원 목록 조회
openapi.app-admin.operation.getMembers.description=게스트 앱 회원 목록을 최근 가입 순(회원 id 내림차순)으로 페이지로 나눠 조회합니다. 조회만 하며 회원을 바꾸는 API는 없습니다. keyword(선택)는 이름, 이메일, 전화번호 중 하나에라도 들어 있으면 찾습니다. 이름과 이메일은 대소문자 구분 없이 글자 그대로(%, _도 글자로) 찾고, 전화번호는 저장값과 검색어 양쪽의 하이픈을 빼고 찾습니다(01012345678로 010-1234-5678을 찾습니다). 하이픈만 있는 검색어는 이름과 이메일에서만 찾습니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.app-admin.operation.getMembers.parameter.keyword=검색어(선택). 이름, 이메일, 전화번호(하이픈 무시)에서 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 전체를 조회합니다.
openapi.app-admin.operation.getMembers.parameter.page=페이지 번호. 0~99, 기본 0
openapi.app-admin.operation.getMembers.parameter.size=페이지 크기. 1~100, 기본 10
openapi.app-admin.operation.getMember.summary=회원 상세 조회
openapi.app-admin.operation.getMember.description=게스트 앱 회원 한 명을 조회합니다. 없는 회원이면 404 MEMBER_NOT_FOUND로 응답합니다.
