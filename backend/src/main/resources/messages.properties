openapi.app-admin.operation.getHotelRooms.description=호텔 하나의 객실 목록을 읽기 전용으로 이름 오름차순(같으면 객실 id 오름차순)으로 페이지로 나눠 조회합니다. 이름 속 숫자는 숫자 크기로 비교하고(예: 99, 101, 1001 순), 숫자로 시작하는 이름, 영문, 한글 순으로 놓입니다. 없는 호텔이면 404 HOTEL_NOT_FOUND로 응답합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
