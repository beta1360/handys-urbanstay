openapi.app-admin.tag.account=전체 어드민 계정과 로그인, 호텔 마스터 계정 관리
openapi.app-admin.operation.login.summary=로그인
openapi.app-admin.operation.login.description=전체 어드민 계정으로 로그인합니다. 로그인하지 않아도 호출할 수 있지만 CSRF 토큰이 필요합니다. 어드민 API 응답으로 받은 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 보냅니다. 처음이라면 내 정보 조회의 401 응답에서 쿠키를 받습니다. 성공하면 새 세션 쿠키와 새 XSRF-TOKEN 쿠키가 발급되고, 이전 토큰은 더 이상 쓸 수 없습니다. 아이디가 없거나 비밀번호가 틀리면 같은 401 INVALID_CREDENTIALS로 응답합니다.
openapi.app-admin.operation.logout.summary=로그아웃
openapi.app-admin.operation.logout.description=세션을 끝내고 세션 쿠키와 XSRF-TOKEN 쿠키를 지웁니다. data는 항상 null입니다. 다음 로그인 전에는 어드민 API 응답(예: 내 정보 조회의 401)에서 새 XSRF-TOKEN 쿠키를 받습니다.
openapi.app-admin.operation.getMe.summary=내 정보 조회
openapi.app-admin.operation.getMe.description=로그인한 전체 어드민의 정보를 조회합니다. 로그인 상태 확인에 씁니다. 로그인하지 않았으면 401 UNAUTHORIZED와 함께 XSRF-TOKEN 쿠키를 발급합니다.
openapi.schema.AccountLoginAppAdminRequest.loginId=로그인 아이디(이메일). 앞뒤 공백과 대소문자는 구분하지 않습니다.
openapi.schema.AccountLoginAppAdminRequest.password=비밀번호
openapi.schema.AccountAppAdminResponse.id=전체 어드민 ID
openapi.schema.AccountAppAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountAppAdminResponse.name=이름
openapi.hotel-admin.tag.account=호텔 계정과 로그인, 운영자 계정 관리(마스터 전용)
openapi.hotel-admin.operation.login.summary=로그인
openapi.hotel-admin.operation.login.description=호텔 계정(마스터·운영자)으로 로그인합니다. 로그인하지 않아도 호출할 수 있지만 CSRF 토큰이 필요합니다. 호텔 운영자 API 응답으로 받은 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 보냅니다. 처음이라면 내 정보 조회의 401 응답에서 쿠키를 받습니다. 성공하면 새 세션 쿠키와 새 XSRF-TOKEN 쿠키가 발급되고, 이전 토큰은 더 이상 쓸 수 없습니다. 아이디가 없거나, 비밀번호가 틀리거나, 비활성 계정이면 모두 같은 401 INVALID_CREDENTIALS로 응답합니다. 전체 어드민 계정으로는 로그인할 수 없습니다.
openapi.hotel-admin.operation.logout.summary=로그아웃
openapi.hotel-admin.operation.logout.description=세션을 끝내고 세션 쿠키와 XSRF-TOKEN 쿠키를 지웁니다. data는 항상 null입니다. 다음 로그인 전에는 호텔 운영자 API 응답(예: 내 정보 조회의 401)에서 새 XSRF-TOKEN 쿠키를 받습니다.
openapi.hotel-admin.operation.getMe.summary=내 정보 조회
openapi.hotel-admin.operation.getMe.description=로그인한 호텔 계정과 소속 호텔의 현재 정보를 조회합니다. 이름과 호텔 이름은 로그인할 때가 아니라 지금 저장된 값입니다. 로그인 상태 확인에 씁니다. 로그인하지 않았으면 401 UNAUTHORIZED와 함께 XSRF-TOKEN 쿠키를 발급합니다. 서버는 호텔 운영자 API 요청마다 계정을 다시 확인합니다. 로그인한 뒤 계정이 비활성화되거나, 비밀번호가 재설정되거나, 아이디가 바뀌었으면 세션을 끊고 401 UNAUTHORIZED로 응답하므로 다시 로그인합니다. 이름만 바뀐 경우는 세션을 유지합니다.
openapi.schema.AccountLoginHotelAdminRequest.loginId=로그인 아이디(이메일). 앞뒤 공백과 대소문자는 구분하지 않습니다.
openapi.schema.AccountLoginHotelAdminRequest.password=비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 비교합니다.
openapi.schema.AccountHotelAdminResponse.id=호텔 계정 ID
openapi.schema.AccountHotelAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountHotelAdminResponse.name=이름
openapi.schema.AccountHotelAdminResponse.role=역할. MASTER(마스터) 또는 OPERATOR(운영자)
openapi.schema.AccountHotelAdminResponse.hotel=소속 호텔
openapi.schema.AccountHotelHotelAdminResponse.id=호텔 ID
openapi.schema.AccountHotelHotelAdminResponse.name=호텔 이름
openapi.app-admin.tag.hotel=호텔 등록·조회·수정
openapi.app-admin.operation.createHotel.summary=호텔 등록
openapi.app-admin.operation.createHotel.description=호텔과 그 호텔의 마스터 계정을 함께 등록합니다. 둘 다 저장되거나 둘 다 저장되지 않습니다. 마스터 비밀번호를 뺀 모든 값은 앞뒤 공백을 지운 뒤 검사하고 저장하며, 최대 길이도 지운 값으로 셉니다. 공백만 있는 값은 빈 값으로 봅니다. 비밀번호는 입력한 그대로 검사하고 저장합니다. 이름과 주소가 모두 같은 호텔(앞뒤 공백을 지운 값을 대소문자까지 그대로 비교)이 이미 있으면 409 HOTEL_DUPLICATED로, 마스터 아이디를 다른 호텔 계정이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 둘 다 해당하면 HOTEL_DUPLICATED입니다. 같은 요청이 동시에 여러 번 와도 하나만 등록되고 나머지는 409 HOTEL_DUPLICATED이며, 서로 다른 호텔을 같은 마스터 아이디로 동시에 등록해도 하나만 등록되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 응답은 등록한 호텔이고 마스터 계정은 담지 않습니다. 등록한 호텔의 version은 0입니다.
openapi.app-admin.operation.getHotels.summary=호텔 목록 조회
openapi.app-admin.operation.getHotels.description=호텔 목록을 최근 등록 순(id 내림차순)으로 페이지로 나눠 조회합니다. keyword를 보내면 이름, 주소, 대표 전화번호 중 하나에 keyword가 들어 있는 호텔만 찾습니다. 이름과 주소는 대소문자 구분 없이, 전화번호는 저장된 번호와 keyword 양쪽의 하이픈(-)을 빼고 비교합니다(예: 0212345678로 02-1234-5678을 찾습니다). 하이픈만 있는 keyword는 전화번호로는 찾지 않습니다. %, _, \\ 같은 문자도 글자 그대로 찾습니다. keyword는 앞뒤 공백을 지운 뒤 100자 이하이고, 없거나 비어 있거나 공백만 있으면 전체를 조회합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. totalElements와 totalPages는 검색 결과 기준이며, totalPages가 100을 넘어도 page는 99까지만 받으므로 그 뒤의 호텔은 keyword로 좁혀 찾습니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.app-admin.operation.getHotels.parameter.keyword=검색어(선택). 이름·주소(대소문자 구분 없이)나 대표 전화번호(양쪽 하이픈을 빼고)에 들어 있는 호텔을 글자 그대로 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 전체를 조회합니다.
openapi.app-admin.operation.getHotels.parameter.page=페이지 번호. 0~99, 기본 0
openapi.app-admin.operation.getHotels.parameter.size=페이지 크기. 1~100, 기본 10
openapi.app-admin.operation.getHotel.summary=호텔 상세 조회
openapi.app-admin.operation.getHotel.description=호텔 하나를 조회합니다. 수정 요청에 보낼 version이 함께 옵니다. 호텔이 없으면 404 HOTEL_NOT_FOUND로 응답합니다.
openapi.app-admin.operation.updateHotel.summary=호텔 수정
openapi.app-admin.operation.updateHotel.description=호텔의 모든 항목을 요청 값으로 바꿉니다. 입력값 규칙은 등록과 같습니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 수정해 version이 다르면 409 HOTEL_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 HOTEL_MODIFIED입니다. 다른 호텔과 이름·주소가 모두 같아지면 409 HOTEL_DUPLICATED로 응답합니다. 이름과 주소를 그대로 두는 수정은 됩니다. 성공하면 최신 version을 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 호텔이 없으면 404 HOTEL_NOT_FOUND로 응답합니다.
openapi.schema.HotelCreateAppAdminRequest.name=호텔 이름. 앞뒤 공백을 지운 뒤 1~100자. 이름이 같은 호텔이 여러 개 있어도 됩니다.
openapi.schema.HotelCreateAppAdminRequest.address=주소(한 줄). 앞뒤 공백을 지운 뒤 1~200자. 이름과 주소가 모두 같은 호텔은 등록할 수 없습니다.
openapi.schema.HotelCreateAppAdminRequest.phone=대표 전화번호. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다.
openapi.schema.HotelCreateAppAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.HotelCreateAppAdminRequest.master=호텔 마스터 계정. 호텔과 함께 만듭니다.
openapi.schema.HotelMasterCreateAppAdminRequest.loginId=마스터 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다.소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다.
openapi.schema.HotelMasterCreateAppAdminRequest.name=마스터 이름. 앞뒤 공백을 지운 뒤 1~50자.
openapi.schema.HotelMasterCreateAppAdminRequest.password=처음 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.schema.HotelUpdateAppAdminRequest.name=호텔 이름. 앞뒤 공백을 지운 뒤 1~100자. 이름이 같은 호텔이 여러 개 있어도 됩니다.
openapi.schema.HotelUpdateAppAdminRequest.address=주소(한 줄). 앞뒤 공백을 지운 뒤 1~200자. 다른 호텔과 이름·주소가 모두 같아지면 수정할 수 없습니다.
openapi.schema.HotelUpdateAppAdminRequest.phone=대표 전화번호. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다.
openapi.schema.HotelUpdateAppAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.HotelUpdateAppAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 HOTEL_MODIFIED입니다.
openapi.schema.HotelAppAdminResponse.id=호텔 ID
openapi.schema.HotelAppAdminResponse.name=호텔 이름
openapi.schema.HotelAppAdminResponse.address=주소
openapi.schema.HotelAppAdminResponse.phone=대표 전화번호(입력한 모양 그대로)
openapi.schema.HotelAppAdminResponse.description=소개. 없으면 null
openapi.schema.HotelAppAdminResponse.version=버전. 값이 바뀌어 저장될 때마다 커집니다. 수정 요청에 그대로 보냅니다.
openapi.hotel-admin.tag.hotel=자기 호텔 정보 조회·수정(마스터 전용)
openapi.hotel-admin.operation.getHotel.summary=내 호텔 정보 조회(마스터 전용)
openapi.hotel-admin.operation.getHotel.description=로그인한 마스터의 호텔 정보를 조회합니다. 수정 요청에 보낼 version이 함께 옵니다. 마스터만 쓰고 운영자 계정은 403 FORBIDDEN입니다.
openapi.hotel-admin.operation.updateHotel.summary=내 호텔 정보 수정(마스터 전용)
openapi.hotel-admin.operation.updateHotel.description=로그인한 마스터의 호텔 정보(이름, 주소, 대표 전화번호, 소개)를 요청 값으로 모두 바꿉니다. 입력값 규칙과 충돌 규칙은 전체 어드민의 호텔 수정과 같습니다. 모든 값은 앞뒤 공백을 지운 뒤 검사하고 저장하며, 최대 길이도 지운 값으로 셉니다. 공백만 있는 값은 빈 값으로 봅니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자(전체 어드민 포함)가 먼저 수정해 version이 다르면 409 HOTEL_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 HOTEL_MODIFIED입니다. 다른 호텔과 이름·주소가 모두 같아지면(앞뒤 공백을 지운 값을 대소문자까지 그대로 비교) 409 HOTEL_DUPLICATED로 응답합니다. version이 다르면서 이름·주소도 겹치면 HOTEL_MODIFIED입니다. 이름과 주소를 그대로 두는 수정은 됩니다. 성공하면 최신 version을 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 마스터만 쓰고 운영자 계정은 403 FORBIDDEN입니다.
openapi.schema.HotelUpdateHotelAdminRequest.name=호텔 이름. 앞뒤 공백을 지운 뒤 1~100자. 이름이 같은 호텔이 여러 개 있어도 됩니다.
openapi.schema.HotelUpdateHotelAdminRequest.address=주소(한 줄). 앞뒤 공백을 지운 뒤 1~200자. 다른 호텔과 이름·주소가 모두 같아지면 수정할 수 없습니다.
openapi.schema.HotelUpdateHotelAdminRequest.phone=대표 전화번호. 숫자와 -만 쓰고 숫자는 8~11개, 앞뒤 공백을 지운 뒤 20자 이하. 입력한 모양 그대로 저장합니다.
openapi.schema.HotelUpdateHotelAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.HotelUpdateHotelAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 HOTEL_MODIFIED입니다.
openapi.schema.HotelHotelAdminResponse.id=호텔 ID
openapi.schema.HotelHotelAdminResponse.name=호텔 이름
openapi.schema.HotelHotelAdminResponse.address=주소(한 줄)
openapi.schema.HotelHotelAdminResponse.phone=대표 전화번호(입력한 모양 그대로)
openapi.schema.HotelHotelAdminResponse.description=소개. 없으면 null
openapi.schema.HotelHotelAdminResponse.version=버전. 값이 바뀌어 저장될 때마다 커집니다. 수정 요청에 그대로 보냅니다.
openapi.schema.PageResponse.items=현재 페이지의 항목
openapi.schema.PageResponse.page=현재 페이지 번호(0부터)
openapi.schema.PageResponse.size=페이지 크기(요청한 size)
openapi.schema.PageResponse.totalElements=전체 항목 수
openapi.schema.PageResponse.totalPages=전체 페이지 수
openapi.app-admin.operation.getHotelMaster.summary=호텔 마스터 조회
openapi.app-admin.operation.getHotelMaster.description=호텔의 마스터 계정을 조회합니다. 비밀번호는 주지 않습니다. 정보 수정 요청에 보낼 version이 함께 옵니다. 호텔이 없으면 404 HOTEL_NOT_FOUND로, 호텔은 있는데 마스터가 없으면 404 HOTEL_MASTER_NOT_FOUND로 응답합니다.
openapi.app-admin.operation.updateHotelMaster.summary=호텔 마스터 정보 수정
openapi.app-admin.operation.updateHotelMaster.description=호텔 마스터의 아이디와 이름을 요청 값으로 바꿉니다. 입력값 규칙은 호텔 등록의 마스터와 같습니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 정보를 수정하거나 비밀번호를 재설정해 version이 다르면 409 HOTEL_ADMIN_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 HOTEL_ADMIN_MODIFIED입니다. 아이디를 다른 호텔 계정(마스터·운영자)이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 자기 아이디를 대소문자나 앞뒤 공백만 바꿔 보내면 같은 아이디라 중복이 아닙니다. version이 다르면서 아이디도 겹치면 HOTEL_ADMIN_MODIFIED입니다. 서로 다른 마스터를 같은 새 아이디로 동시에 바꿔도 하나만 반영되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 아이디가 실제로 바뀌면(소문자로 바꾼 값이 지금과 다르면) 그 마스터가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊기고, 마스터는 새 아이디로 다시 로그인합니다. 이름만 바꾸거나 대소문자·앞뒤 공백만 다른 같은 아이디를 보내면 세션은 유지됩니다. 성공하면 수정한 마스터를 최신 version과 함께 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 호텔이 없으면 404 HOTEL_NOT_FOUND, 호텔은 있는데 마스터가 없으면 404 HOTEL_MASTER_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelMasterUpdateAppAdminRequest.loginId=마스터 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다. 소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다. 실제로 바뀌면 마스터의 기존 로그인 세션이 끊깁니다.
openapi.schema.AccountHotelMasterUpdateAppAdminRequest.name=마스터 이름. 앞뒤 공백을 지운 뒤 1~50자. 바꿔도 마스터의 로그인 세션은 유지됩니다.
openapi.schema.AccountHotelMasterUpdateAppAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 HOTEL_ADMIN_MODIFIED입니다.
openapi.schema.AccountHotelMasterAppAdminResponse.id=호텔 마스터 계정 ID
openapi.schema.AccountHotelMasterAppAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountHotelMasterAppAdminResponse.name=이름
openapi.schema.AccountHotelMasterAppAdminResponse.version=버전. 정보 수정이나 비밀번호 재설정으로 마스터 계정이 바뀌어 저장될 때마다 커집니다. 정보 수정 요청에 그대로 보냅니다.
openapi.app-admin.operation.resetHotelMasterPassword.summary=호텔 마스터 비밀번호 재설정
openapi.app-admin.operation.resetHotelMasterPassword.description=호텔 마스터의 비밀번호를 새 비밀번호로 바꿉니다. 비밀번호 규칙은 호텔 등록의 마스터 처음 비밀번호와 같고, 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 지금과 같은 비밀번호로도 재설정할 수 있습니다. version은 보내지 않습니다. 성공하면 data는 null입니다. 재설정하면 같은 비밀번호로 바꿨더라도 그 마스터가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊기고, 마스터는 새 비밀번호로 다시 로그인합니다. 재설정도 마스터 계정을 바꾸므로 version이 1 커집니다. 그래서 재설정 전에 조회한 version으로 정보를 수정하면 409 HOTEL_ADMIN_MODIFIED이므로 다시 조회한 뒤 수정합니다. 같은 마스터의 정보 수정이나 다른 재설정과 동시에 처리되면 늦은 쪽이 409 HOTEL_ADMIN_MODIFIED일 수 있고, 이때 비밀번호는 바뀌지 않았으므로 다시 시도합니다. 호텔이 없으면 404 HOTEL_NOT_FOUND, 호텔은 있는데 마스터가 없으면 404 HOTEL_MASTER_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelMasterPasswordResetAppAdminRequest.password=새 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.hotel-admin.operation.createHotelOperator.summary=운영자 등록
openapi.hotel-admin.operation.createHotelOperator.description=로그인한 마스터의 호텔에 운영자 계정을 등록합니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. 아이디와 이름은 앞뒤 공백을 지운 뒤 검사하고 저장하며, 최대 길이도 지운 값으로 셉니다. 공백만 있는 값은 빈 값으로 봅니다. 비밀번호는 입력한 그대로 검사하고 저장합니다. 등록한 운영자는 활성 상태이고 version은 0이며, 바로 호텔 운영자 앱에 로그인할 수 있습니다. 아이디를 다른 호텔 계정(마스터·운영자, 다른 호텔과 비활성 계정 포함)이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 같은 아이디로 동시에 여러 번 등록해도 하나만 등록되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 응답은 등록한 운영자입니다.
openapi.hotel-admin.operation.getHotelOperators.summary=운영자 목록 조회
openapi.hotel-admin.operation.getHotelOperators.description=로그인한 마스터의 호텔에 속한 운영자 목록을 최근 등록 순(id 내림차순)으로 페이지로 나눠 조회합니다. 마스터 자신과 다른 호텔의 계정은 나오지 않습니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. active를 보내지 않으면 활성·비활성 운영자를 모두, true면 활성 운영자만, false면 비활성 운영자만 조회합니다. keyword를 보내면 이름이나 아이디에 keyword가 들어 있는 운영자만 대소문자 구분 없이 찾습니다. %, _, \ 같은 문자도 글자 그대로 찾습니다. keyword는 앞뒤 공백을 지운 뒤 100자 이하이고, 없거나 비어 있거나 공백만 있으면 거르지 않습니다. keyword와 active를 함께 보내면 둘 다 맞는 운영자만 조회합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. totalElements와 totalPages는 조건에 맞는 결과 기준이며, totalPages가 100을 넘어도 page는 99까지만 받으므로 그 뒤의 운영자는 keyword로 좁혀 찾습니다. 범위를 벗어나거나 active가 소문자 true나 false가 아니면(빈 값, 대문자, 1·0 포함) 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.hotel-admin.operation.getHotelOperators.parameter.keyword=검색어(선택). 이름이나 아이디에 들어 있는 운영자를 대소문자 구분 없이 글자 그대로 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 거르지 않습니다.
openapi.hotel-admin.operation.getHotelOperators.parameter.active=활성 여부(선택). 소문자 true면 활성 운영자만, false면 비활성 운영자만 조회합니다. 보내지 않으면 모두 조회하고, 그 밖의 값(빈 값 포함)은 400 INVALID_INPUT입니다.
openapi.hotel-admin.operation.getHotelOperators.parameter.page=페이지 번호. 0~99, 기본 0
openapi.hotel-admin.operation.getHotelOperators.parameter.size=페이지 크기. 1~100, 기본 10
openapi.hotel-admin.operation.getHotelOperator.summary=운영자 조회
openapi.hotel-admin.operation.getHotelOperator.description=로그인한 마스터의 호텔에 속한 운영자 하나를 조회합니다. 비밀번호는 주지 않습니다. 정보 수정 요청에 보낼 version이 함께 옵니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. 없는 id, 다른 호텔의 계정, 마스터 자신의 id는 모두 404 HOTEL_OPERATOR_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelOperatorCreateHotelAdminRequest.loginId=운영자 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다. 소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자, 비활성 계정 포함)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다.
openapi.schema.AccountHotelOperatorCreateHotelAdminRequest.name=운영자 이름. 앞뒤 공백을 지운 뒤 1~50자.
openapi.schema.AccountHotelOperatorCreateHotelAdminRequest.password=처음 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.schema.AccountHotelOperatorHotelAdminResponse.id=운영자 계정 ID
openapi.schema.AccountHotelOperatorHotelAdminResponse.loginId=로그인 아이디(이메일, 소문자)
openapi.schema.AccountHotelOperatorHotelAdminResponse.name=이름
openapi.schema.AccountHotelOperatorHotelAdminResponse.active=활성 여부. false면 호텔 운영자 앱에 로그인할 수 없습니다.
openapi.schema.AccountHotelOperatorHotelAdminResponse.version=버전. 정보 수정, 비밀번호 재설정, 활성 상태 변경으로 운영자 계정이 바뀌어 저장될 때마다 커집니다. 정보 수정 요청에 그대로 보냅니다.
openapi.hotel-admin.operation.updateHotelOperator.summary=운영자 정보 수정
openapi.hotel-admin.operation.updateHotelOperator.description=로그인한 마스터의 호텔에 속한 운영자의 아이디와 이름을 요청 값으로 바꿉니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. 입력값 규칙은 운영자 등록과 같습니다. 비활성 운영자도 수정할 수 있습니다. 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 정보를 수정하거나, 비밀번호를 재설정하거나, 활성 상태를 바꿔 version이 다르면 409 HOTEL_ADMIN_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 HOTEL_ADMIN_MODIFIED입니다. 아이디를 다른 호텔 계정(마스터·운영자, 다른 호텔과 비활성 계정 포함)이 이미 쓰고 있으면(대소문자와 앞뒤 공백은 구분하지 않음) 409 LOGIN_ID_DUPLICATED로 응답합니다. 자기 아이디를 대소문자나 앞뒤 공백만 바꿔 보내면 같은 아이디라 중복이 아닙니다. version이 다르면서 아이디도 겹치면 HOTEL_ADMIN_MODIFIED입니다. 서로 다른 운영자를 같은 새 아이디로 동시에 바꿔도 하나만 반영되고 나머지는 409 LOGIN_ID_DUPLICATED입니다. 아이디가 실제로 바뀌면(소문자로 바꾼 값이 지금과 다르면) 그 운영자가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊기고, 운영자는 새 아이디로 다시 로그인합니다. 이름만 바꾸거나 대소문자·앞뒤 공백만 다른 같은 아이디를 보내면 세션은 유지됩니다. 마스터 자신의 세션은 영향을 받지 않습니다. 성공하면 수정한 운영자를 최신 version과 함께 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 없는 id, 다른 호텔의 계정, 마스터 자신의 id는 모두 404 HOTEL_OPERATOR_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelOperatorUpdateHotelAdminRequest.loginId=운영자 로그인 아이디(이메일). 앞뒤 공백을 지운 뒤 이메일 형식이고 254자 이하. 공백을 뺀 영문 자판의 글자(영문, 숫자, 특수문자)만 쓸 수 있고, @ 뒤 도메인은 빈 조각 없이 점으로 나눈 두 조각 이상이어야 합니다. 소문자로 바꿔 저장하므로 대소문자와 앞뒤 공백만 다른 아이디는 같은 아이디입니다. 모든 호텔 계정(마스터·운영자, 비활성 계정 포함)을 통틀어 유일해야 하고, 전체 어드민 계정과는 같아도 됩니다. 실제로 바뀌면 운영자의 기존 로그인 세션이 끊깁니다.
openapi.schema.AccountHotelOperatorUpdateHotelAdminRequest.name=운영자 이름. 앞뒤 공백을 지운 뒤 1~50자. 바꿔도 운영자의 로그인 세션은 유지됩니다.
openapi.schema.AccountHotelOperatorUpdateHotelAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 HOTEL_ADMIN_MODIFIED입니다.
openapi.hotel-admin.operation.resetHotelOperatorPassword.summary=운영자 비밀번호 재설정
openapi.hotel-admin.operation.resetHotelOperatorPassword.description=로그인한 마스터의 호텔에 속한 운영자의 비밀번호를 새 비밀번호로 바꿉니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. 비밀번호 규칙은 운영자 등록의 처음 비밀번호와 같고, 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 지금과 같은 비밀번호로도 재설정할 수 있고, 비활성 운영자도 재설정할 수 있습니다(로그인은 다시 활성화한 뒤에 할 수 있습니다). version은 보내지 않습니다. 성공하면 data는 null입니다. 재설정하면 같은 비밀번호로 바꿨더라도 그 운영자가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊기고, 운영자는 새 비밀번호로 다시 로그인합니다. 마스터 자신의 세션은 영향을 받지 않습니다. 재설정도 운영자 계정을 바꾸므로 version이 1 커집니다. 그래서 재설정 전에 조회한 version으로 정보를 수정하면 409 HOTEL_ADMIN_MODIFIED이므로 다시 조회한 뒤 수정합니다. 같은 운영자의 다른 변경과 동시에 처리되면 늦은 쪽이 409 HOTEL_ADMIN_MODIFIED일 수 있고, 이때 비밀번호는 바뀌지 않았으므로 다시 시도합니다. 없는 id, 다른 호텔의 계정, 마스터 자신의 id는 모두 404 HOTEL_OPERATOR_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelOperatorPasswordResetHotelAdminRequest.password=새 비밀번호. 앞뒤 공백을 지우지 않고 입력한 그대로 씁니다. 8~64자이고 영문과 숫자를 모두 넣어야 합니다. 영문 자판의 글자(영문, 숫자, 특수문자, 공백)만 쓸 수 있고 한글 등은 쓸 수 없습니다.
openapi.hotel-admin.operation.updateHotelOperatorActive.summary=운영자 활성 상태 변경
openapi.hotel-admin.operation.updateHotelOperatorActive.description=로그인한 마스터의 호텔에 속한 운영자를 비활성화하거나 다시 활성화합니다. 운영자 계정은 지우지 않고 비활성화합니다. 마스터 전용이며, 운영자 계정으로 호출하면 403 FORBIDDEN입니다. active를 false로 보내면 비활성화합니다. 비활성 운영자는 로그인할 수 없고(아이디나 비밀번호가 틀렸을 때와 같은 401 INVALID_CREDENTIALS), 그 운영자가 호텔 운영자 앱에 로그인해 둔 세션은 다음 요청에서 401 UNAUTHORIZED로 끊깁니다. active를 true로 보내면 다시 활성화해 다시 로그인할 수 있습니다. 비활성화로 끊긴 세션은 다시 활성화해도 되살아나지 않으므로 새로 로그인합니다. 이미 요청한 상태이면 아무것도 바꾸지 않고 지금 운영자를 200으로 돌려주며 version도 그대로입니다. 마스터 자신의 세션은 영향을 받지 않습니다. version은 보내지 않습니다. 상태가 바뀌면 version이 1 커지므로, 그 전에 조회한 version으로 정보를 수정하면 409 HOTEL_ADMIN_MODIFIED이고 다시 조회한 뒤 수정합니다. 같은 운영자의 다른 변경과 동시에 처리되면 늦은 쪽이 409 HOTEL_ADMIN_MODIFIED일 수 있고, 이때 상태는 바뀌지 않았으므로 다시 시도합니다. 성공하면 운영자를 최신 version과 함께 돌려줍니다. 없는 id, 다른 호텔의 계정, 마스터 자신의 id는 모두 404 HOTEL_OPERATOR_NOT_FOUND로 응답합니다.
openapi.schema.AccountHotelOperatorActiveUpdateHotelAdminRequest.active=바꿀 활성 여부. false면 비활성화하고(기존 로그인 세션이 끊기고 로그인할 수 없음), true면 다시 활성화합니다. 지금과 같은 값이면 아무것도 바꾸지 않습니다.
error.ROOM_NOT_FOUND=객실을 찾을 수 없습니다.
error.ROOM_DUPLICATED=같은 이름의 객실이 이미 있습니다.
openapi.hotel-admin.tag.room=객실 유형 관리와 객실 생성·수정(마스터), 객실 조회·상태 변경·이력 조회(마스터·운영자)
openapi.hotel-admin.operation.createRoom.summary=객실 생성
openapi.hotel-admin.operation.createRoom.description=로그인한 마스터의 호텔에 객실을 생성합니다. 마스터만 쓸 수 있고 운영자는 403 FORBIDDEN입니다. 대상 호텔은 로그인한 계정의 호텔이며 요청으로 정하지 않습니다. 이름과 소개는 앞뒤 공백을 지운 뒤 검사하고 저장하며, 최대 길이도 지운 값으로 셉니다. 공백만 있는 값은 빈 값으로 보고, 소개가 없거나 비어 있거나 공백만 있으면 null로 저장합니다. 층은 -10~200이고(지하는 음수) 없거나 null이어도 됩니다. 객실 유형은 객실 유형 목록의 id(roomTypeId)로 고르고, 최대 인원·1박 요금·체크인·체크아웃 시각은 그 유형의 값을 씁니다. 없는 유형이나 다른 호텔의 유형이면 404 ROOM_TYPE_NOT_FOUND입니다. 같은 호텔에 이름이 같은 객실(앞뒤 공백을 지운 값을 대소문자까지 그대로 비교)이 이미 있으면 409 ROOM_DUPLICATED로 응답합니다. 다른 호텔의 객실과는 이름이 같아도 됩니다. 같은 이름으로 동시에 여러 번 생성해도 하나만 생성되고 나머지는 409 ROOM_DUPLICATED입니다. 새 객실의 상태는 VACANT(공실)이고 요청으로 정하지 않습니다(status를 보내면 400 INVALID_INPUT). 생성과 함께 이전 상태가 없는(null) VACANT 상태 이력을 생성한 계정으로 남깁니다. 응답은 생성한 객실이고 version은 0입니다.
openapi.hotel-admin.operation.getRoom.summary=객실 조회
openapi.hotel-admin.operation.getRoom.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 객실 하나를 조회합니다. 수정 요청에 보낼 version과 상태 변경 요청의 from에 보낼 지금 상태(status)가 함께 옵니다. 지금 이용(currentStay)과 그 이용객도 함께 옵니다. 객실 유형(roomType)의 이름, 최대 인원, 1박 요금, 체크인·체크아웃 시각("HH:mm")도 함께 옵니다. 없는 id와 다른 호텔의 객실 id는 모두 404 ROOM_NOT_FOUND로 응답합니다.
openapi.schema.RoomCreateHotelAdminRequest.name=객실 이름(호수). 예: 101, 스위트 A. 앞뒤 공백을 지운 뒤 1~50자. 같은 호텔에 이름이 같은 객실(대소문자 구분)은 둘 수 없고, 다른 호텔의 객실과는 같아도 됩니다.
openapi.schema.RoomCreateHotelAdminRequest.roomTypeId=객실 유형 ID. 같은 호텔의 객실 유형 목록에서 고릅니다. 없는 유형이나 다른 호텔의 유형이면 404 ROOM_TYPE_NOT_FOUND입니다.
openapi.schema.RoomCreateHotelAdminRequest.floor=층(선택). -10~200 정수이고 지하는 음수입니다. 없거나 null이면 층 없이 저장합니다.
openapi.schema.RoomCreateHotelAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.RoomHotelAdminResponse.id=객실 ID
openapi.schema.RoomHotelAdminResponse.name=객실 이름(호수)
openapi.schema.RoomHotelAdminResponse.roomType=객실 유형(조회 시점의 값). 최대 인원, 1박 요금, 체크인·체크아웃 시각은 유형의 값입니다.
openapi.schema.RoomRoomTypeHotelAdminResponse.id=객실 유형 ID
openapi.schema.RoomRoomTypeHotelAdminResponse.name=객실 유형 이름
openapi.schema.RoomRoomTypeHotelAdminResponse.capacity=최대 인원
openapi.schema.RoomRoomTypeHotelAdminResponse.roomRate=1박 요금(원)
openapi.schema.RoomRoomTypeHotelAdminResponse.checkInTime=체크인 시각("HH:mm")
openapi.schema.RoomRoomTypeHotelAdminResponse.checkOutTime=체크아웃 시각("HH:mm")
openapi.schema.RoomHotelAdminResponse.floor=층. 지하는 음수이고 없으면 null
openapi.schema.RoomHotelAdminResponse.description=소개. 없으면 null
openapi.schema.RoomHotelAdminResponse.status=객실 상태. VACANT(공실), RESERVED(예약됨), OCCUPIED(이용중), MAINTENANCE(정비중). 새 객실은 VACANT이고 상태 변경 API로만 바뀝니다.
openapi.schema.RoomHotelAdminResponse.currentStay=지금 이용. 오늘(한국 시간)이 체크인 날짜와 같거나 뒤이고 체크아웃 날짜보다 앞인, 취소하지 않은 이용과 그 이용객입니다. 체크아웃 날에는 그 이용이 지금 이용이 아닙니다. 없으면 null이고, 새로 생성한 객실은 항상 null입니다. 객실 상태와 따로 정해지며 상태를 바꾸지 않습니다.
openapi.schema.RoomHotelAdminResponse.version=버전. 객실 정보가 바뀌어 저장될 때마다 커집니다. 상태가 바뀌어도 그대로입니다. 수정 요청에 그대로 보냅니다.
openapi.schema.RoomCurrentStayHotelAdminResponse.id=이용 ID
openapi.schema.RoomCurrentStayHotelAdminResponse.checkInDate=체크인 날짜("YYYY-MM-DD")
openapi.schema.RoomCurrentStayHotelAdminResponse.checkOutDate=체크아웃 날짜("YYYY-MM-DD"). 이 날은 묵지 않습니다.
openapi.schema.RoomCurrentStayHotelAdminResponse.guest=이용객(조회 시점의 이름과 전화번호)
openapi.schema.RoomCurrentStayGuestHotelAdminResponse.id=이용객 ID
openapi.schema.RoomCurrentStayGuestHotelAdminResponse.name=이용객 이름
openapi.schema.RoomCurrentStayGuestHotelAdminResponse.phone=전화번호(입력한 모양 그대로)
openapi.hotel-admin.operation.getRooms.summary=객실 목록 조회
openapi.hotel-admin.operation.getRooms.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 객실 목록을 이름 오름차순으로 페이지로 나눠 조회합니다. 다른 호텔의 객실은 나오지 않습니다. 객실마다 지금 이용(currentStay)과 그 이용객을 함께 보여줍니다. 이름 속 숫자는 숫자 크기로 비교하고(예: 99, 101, 1001, B동 99, B동 101 순), 숫자로 시작하는 이름, 영문, 한글 순으로 놓입니다. 영문은 대소문자와 관계없이 비교하고, 대소문자만 다른 이름은 소문자가 먼저입니다(예: deluxe, Deluxe). keyword를 보내면 이름에 keyword가 들어 있는 객실만 대소문자 구분 없이 찾습니다. %, _, \ 같은 문자도 글자 그대로 찾습니다. keyword는 앞뒤 공백을 지운 뒤 100자 이하이고, 없거나 비어 있거나 공백만 있으면 전체를 조회합니다. status를 보내면 그 상태의 객실만 조회합니다. status는 VACANT, RESERVED, OCCUPIED, MAINTENANCE 중 하나(대소문자 구분)이고, 보내지 않거나 비어 있거나 공백만 있으면 상태로 거르지 않으며, 그 밖의 값이면 400 INVALID_INPUT으로 응답하고 fieldErrors에 status를 담습니다. roomTypeId를 보내면 그 객실 유형의 객실만 조회합니다. 없거나 다른 호텔의 유형 id면 빈 목록이고, 정수가 아니면 400 INVALID_INPUT으로 응답하고 fieldErrors에 roomTypeId를 담습니다. keyword, status, roomTypeId를 함께 보내면 모두 맞는 객실만 이름 오름차순으로 조회합니다. page는 0~99(기본 0), size는 1~100(기본 10)입니다. totalElements와 totalPages는 검색 결과 기준이며, totalPages가 100을 넘어도 page는 99까지만 받으므로 그 뒤의 객실은 keyword로 좁혀 찾습니다. 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다.
openapi.hotel-admin.operation.getRooms.parameter.keyword=이름 검색어(선택). 이름에 들어 있는 객실을 대소문자 구분 없이 글자 그대로 찾습니다. 앞뒤 공백을 지운 뒤 100자 이하이고, 비어 있거나 공백만 있으면 전체를 조회합니다.
openapi.hotel-admin.operation.getRooms.parameter.status=상태(선택). VACANT, RESERVED, OCCUPIED, MAINTENANCE 중 하나(대소문자 구분)이면 그 상태의 객실만 조회합니다. 보내지 않거나 비어 있거나 공백만 있으면 상태로 거르지 않습니다.
openapi.hotel-admin.operation.getRooms.parameter.roomTypeId=객실 유형 ID(선택). 그 유형의 객실만 조회합니다. 없거나 다른 호텔의 유형 id면 빈 목록입니다.
openapi.hotel-admin.operation.getRooms.parameter.page=페이지 번호. 0~99, 기본 0
openapi.hotel-admin.operation.getRooms.parameter.size=페이지 크기. 1~100, 기본 10
error.ROOM_MODIFIED=다른 사용자가 먼저 수정했습니다. 다시 불러온 뒤 시도해 주세요.
openapi.hotel-admin.operation.updateRoom.summary=객실 수정
openapi.hotel-admin.operation.updateRoom.description=로그인한 마스터의 호텔에 속한 객실의 모든 항목을 요청 값으로 바꿉니다. 마스터만 쓸 수 있고 운영자는 403 FORBIDDEN입니다. 입력값 규칙은 객실 생성과 같고, 층이나 소개를 보내지 않거나 null로 보내면 null로 바뀝니다. 객실 유형도 roomTypeId로 바꿀 수 있고, 없는 유형이나 다른 호텔의 유형이면 404 ROOM_TYPE_NOT_FOUND입니다(version 확인 다음, 이름 중복 확인 전). 조회할 때 받은 version을 함께 보냅니다. 그사이 다른 사용자가 먼저 수정해 version이 다르면 409 ROOM_MODIFIED로 응답하므로, 다시 조회한 뒤 수정합니다. 동시에 같은 version으로 수정하면 하나만 반영되고 나머지는 409 ROOM_MODIFIED입니다. 같은 호텔의 다른 객실과 이름이 같아지면(앞뒤 공백을 지운 값을 대소문자까지 그대로 비교) 409 ROOM_DUPLICATED로 응답합니다. 이름을 그대로 두는 수정은 되고, 다른 호텔의 객실과는 이름이 같아도 됩니다. version이 다르면서 이름도 겹치면 ROOM_MODIFIED입니다. 서로 다른 객실을 같은 새 이름으로 동시에 바꿔도 하나만 반영되고 나머지는 409 ROOM_DUPLICATED입니다. 성공하면 수정한 객실을 최신 version과 함께 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 객실 상태는 이 API로 바꾸지 않고(status를 보내면 400 INVALID_INPUT) 상태 변경 API로 바꿉니다. 상태는 version과 따로 움직여, 그사이 상태가 바뀌어도 조회할 때 받은 version으로 수정할 수 있고 수정해도 상태는 그대로입니다. 없는 id와 다른 호텔의 객실 id는 모두 404 ROOM_NOT_FOUND로 응답합니다.
openapi.schema.RoomUpdateHotelAdminRequest.name=객실 이름(호수). 예: 101, 스위트 A. 앞뒤 공백을 지운 뒤 1~50자. 같은 호텔의 다른 객실과 이름이 같아지면(대소문자 구분) 수정할 수 없고, 다른 호텔의 객실과는 같아도 됩니다.
openapi.schema.RoomUpdateHotelAdminRequest.roomTypeId=객실 유형 ID. 같은 호텔의 객실 유형 목록에서 고릅니다. 없는 유형이나 다른 호텔의 유형이면 404 ROOM_TYPE_NOT_FOUND입니다.
openapi.schema.RoomUpdateHotelAdminRequest.floor=층(선택). -10~200 정수이고 지하는 음수입니다. 없거나 null이면 층을 비웁니다(null로 저장).
openapi.schema.RoomUpdateHotelAdminRequest.description=소개(선택). 앞뒤 공백을 지운 뒤 1000자 이하. 없거나 비어 있거나 공백만 있으면 null로 저장합니다.
openapi.schema.RoomUpdateHotelAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 ROOM_MODIFIED입니다.
error.ROOM_STATUS_TRANSITION_NOT_ALLOWED=지금 상태에서 바꿀 수 없는 상태입니다.
error.ROOM_STATUS_CHANGED=다른 사용자가 먼저 상태를 바꿨습니다. 다시 불러온 뒤 시도해 주세요.
error.ROOM_TYPE_NOT_FOUND=객실 유형을 찾을 수 없습니다.
error.ROOM_TYPE_UNAVAILABLE=선택한 기간과 인원으로 예약할 수 있는 객실이 없습니다.
error.ROOM_TYPE_DUPLICATED=같은 이름의 객실 유형이 이미 있습니다.
error.ROOM_TYPE_MODIFIED=다른 사용자가 먼저 수정했습니다. 다시 불러온 뒤 시도해 주세요.
openapi.hotel-admin.operation.createRoomType.summary=객실 유형 생성
openapi.hotel-admin.operation.createRoomType.description=로그인한 마스터의 호텔에 객실 유형을 만듭니다. 마스터만 쓸 수 있고 운영자는 403 FORBIDDEN입니다. 대상 호텔은 로그인한 계정의 호텔이며 요청으로 정하지 않습니다. 이름은 앞뒤 공백을 지운 뒤 1~50자, 최대 인원은 1~20, 1박 요금은 0~10,000,000원 정수입니다. 체크인·체크아웃 시각은 "HH:mm" 형식의 문자열(00:00~23:59, 예: "15:00")만 받고, 초가 붙은 값이나 한 자리 시 같은 다른 형식은 400 INVALID_INPUT으로 응답하고 fieldErrors에 그 필드를 담습니다. 체크인과 체크아웃 시각의 앞뒤는 비교하지 않습니다. 같은 호텔에 이름이 같은 유형(앞뒤 공백을 지운 값을 대소문자까지 그대로 비교)이 이미 있으면 409 ROOM_TYPE_DUPLICATED이고, 다른 호텔의 유형과는 이름이 같아도 됩니다. 응답은 만든 유형이고 version은 0입니다. 유형은 지우지 않습니다.
openapi.hotel-admin.operation.getRoomTypes.summary=객실 유형 목록 조회
openapi.hotel-admin.operation.getRoomTypes.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 객실 유형을 모두 이름 오름차순(같으면 id 오름차순)으로 조회합니다. 객실 생성·수정의 유형 선택과 거르기에 쓰므로 페이지로 나누지 않고 전부 돌려줍니다. 이름 속 숫자는 숫자 크기로 비교하고(예: 2인실, 10인실 순), 숫자로 시작하는 이름, 영문, 한글 순이며, 대소문자만 다른 이름은 소문자가 먼저입니다(예: deluxe, Deluxe).
openapi.hotel-admin.operation.getRoomType.summary=객실 유형 조회
openapi.hotel-admin.operation.getRoomType.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 객실 유형 하나를 조회합니다. 수정 요청에 보낼 version이 함께 옵니다. 없는 id와 다른 호텔의 유형 id는 모두 404 ROOM_TYPE_NOT_FOUND로 응답합니다.
openapi.hotel-admin.operation.updateRoomType.summary=객실 유형 수정
openapi.hotel-admin.operation.updateRoomType.description=로그인한 마스터의 호텔에 속한 객실 유형의 모든 항목을 요청 값으로 바꿉니다. 마스터만 쓸 수 있고 운영자는 403 FORBIDDEN입니다. 입력값 규칙은 생성과 같습니다. 조회할 때 받은 version을 함께 보내고, 그사이 다른 사용자가 먼저 수정해 version이 다르면 409 ROOM_TYPE_MODIFIED입니다. 같은 호텔의 다른 유형과 이름이 같아지면 409 ROOM_TYPE_DUPLICATED이고, version이 다르면서 이름도 겹치면 ROOM_TYPE_MODIFIED입니다. 바꾼 값은 그 유형의 모든 객실에 바로 적용되고, 1박 요금은 그 뒤의 예약부터 쓰이며 이미 한 예약의 금액은 그대로입니다. 성공하면 수정한 유형을 최신 version과 함께 돌려주며, 바뀐 값이 없으면 version도 그대로입니다. 없는 id와 다른 호텔의 유형 id는 모두 404 ROOM_TYPE_NOT_FOUND로 응답합니다.
openapi.schema.RoomTypeCreateHotelAdminRequest.name=객실 유형 이름. 예: 스탠다드, 디럭스. 앞뒤 공백을 지운 뒤 1~50자. 같은 호텔에 이름이 같은 유형(대소문자 구분)은 둘 수 없습니다.
openapi.schema.RoomTypeCreateHotelAdminRequest.capacity=최대 인원. 1~20 정수. 이보다 많은 인원은 이 유형에 예약할 수 없습니다.
openapi.schema.RoomTypeCreateHotelAdminRequest.roomRate=1박 요금(원). 0~10,000,000 정수.
openapi.schema.RoomTypeCreateHotelAdminRequest.checkInTime=체크인 시각. "HH:mm" 형식(00:00~23:59, 분 단위)의 문자열. 초를 붙이거나 한 자리 시로 보내면 400입니다. 체크아웃 시각과 앞뒤를 비교하지 않습니다.
openapi.schema.RoomTypeCreateHotelAdminRequest.checkOutTime=체크아웃 시각. "HH:mm" 형식(00:00~23:59, 분 단위)의 문자열. 초를 붙이거나 한 자리 시로 보내면 400입니다. 보통 다음 날이라 체크인 시각보다 이르거나 같아도 됩니다.
openapi.schema.RoomTypeUpdateHotelAdminRequest.name=객실 유형 이름. 예: 스탠다드, 디럭스. 앞뒤 공백을 지운 뒤 1~50자. 같은 호텔의 다른 유형과 이름이 같아지면(대소문자 구분) 수정할 수 없습니다.
openapi.schema.RoomTypeUpdateHotelAdminRequest.capacity=최대 인원. 1~20 정수. 이보다 많은 인원은 이 유형에 예약할 수 없습니다.
openapi.schema.RoomTypeUpdateHotelAdminRequest.roomRate=1박 요금(원). 0~10,000,000 정수.
openapi.schema.RoomTypeUpdateHotelAdminRequest.checkInTime=체크인 시각. "HH:mm" 형식(00:00~23:59, 분 단위)의 문자열. 초를 붙이거나 한 자리 시로 보내면 400입니다. 체크아웃 시각과 앞뒤를 비교하지 않습니다.
openapi.schema.RoomTypeUpdateHotelAdminRequest.checkOutTime=체크아웃 시각. "HH:mm" 형식(00:00~23:59, 분 단위)의 문자열. 초를 붙이거나 한 자리 시로 보내면 400입니다. 보통 다음 날이라 체크인 시각보다 이르거나 같아도 됩니다.
openapi.schema.RoomTypeUpdateHotelAdminRequest.version=조회할 때 받은 version. 현재 version과 다르면 409 ROOM_TYPE_MODIFIED입니다.
openapi.schema.RoomTypeHotelAdminResponse.id=객실 유형 ID
openapi.schema.RoomTypeHotelAdminResponse.name=객실 유형 이름
openapi.schema.RoomTypeHotelAdminResponse.capacity=최대 인원
openapi.schema.RoomTypeHotelAdminResponse.roomRate=1박 요금(원)
openapi.schema.RoomTypeHotelAdminResponse.checkInTime=체크인 시각("HH:mm")
openapi.schema.RoomTypeHotelAdminResponse.checkOutTime=체크아웃 시각("HH:mm")
openapi.schema.RoomTypeHotelAdminResponse.version=버전. 유형 정보가 바뀌어 저장될 때마다 커집니다. 수정 요청에 그대로 보냅니다.
openapi.hotel-admin.operation.updateRoomStatus.summary=객실 상태 변경
openapi.hotel-admin.operation.updateRoomStatus.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 객실의 상태를 바꿉니다. 상태는 VACANT(공실), RESERVED(예약됨), OCCUPIED(이용중), MAINTENANCE(정비중)이고, 바꿀 수 있는 변경은 VACANT → RESERVED, RESERVED → OCCUPIED, OCCUPIED → MAINTENANCE, MAINTENANCE → VACANT, RESERVED → VACANT(예약을 되돌림), VACANT → MAINTENANCE(이용 없이 정비) 여섯 가지뿐입니다. from에는 화면에서 본 지금 상태를, to에는 바꿀 상태를 보냅니다. from → to가 이 여섯 가지가 아니면(같은 상태로 바꾸는 요청 포함) 409 ROOM_STATUS_TRANSITION_NOT_ALLOWED로 응답합니다. 서버는 객실의 지금 상태가 from일 때만 바꾸므로, 그사이 다른 사용자가 먼저 상태를 바꿨으면 409 ROOM_STATUS_CHANGED로 응답하고 아무것도 바꾸지 않습니다. 이때는 객실을 다시 조회해 지금 상태를 확인한 뒤 시도합니다. 같은 객실을 같은 from으로 동시에 바꾸면 하나만 반영되고 나머지는 409 ROOM_STATUS_CHANGED입니다. 허용되지 않는 변경이면서 from도 지금 상태와 다르면 ROOM_STATUS_TRANSITION_NOT_ALLOWED입니다. 상태는 객실 정보의 version과 따로 움직입니다. 상태를 바꿔도 version은 그대로라 열어 둔 객실 수정은 거절되지 않고, 객실 수정은 상태를 바꾸지 않습니다. 상태가 바뀔 때마다 이전 상태, 바뀐 상태, 바꾼 계정(id와 그때의 이름), 바꾼 시각을 이력으로 남기고, 이력은 객실 상태 이력 조회 API로 봅니다. 성공하면 바뀐 상태의 객실을 돌려주며 version은 그대로입니다. 없는 id와 다른 호텔의 객실 id는 모두 404 ROOM_NOT_FOUND로 응답합니다. from이나 to가 없거나 null이면 필수 입력, 네 상태 이름이 아닌 값(소문자, 빈 문자열, 숫자 등)이면 형식 오류로 400 INVALID_INPUT이고 fieldErrors에 그 필드를 담습니다.
openapi.schema.RoomStatusUpdateHotelAdminRequest.from=화면에서 본 지금 상태. VACANT, RESERVED, OCCUPIED, MAINTENANCE 중 하나(대소문자 구분). 객실의 지금 상태와 다르면 409 ROOM_STATUS_CHANGED입니다.
openapi.schema.RoomStatusUpdateHotelAdminRequest.to=바꿀 상태. VACANT, RESERVED, OCCUPIED, MAINTENANCE 중 하나(대소문자 구분). from에서 바꿀 수 없는 상태(같은 상태 포함)면 409 ROOM_STATUS_TRANSITION_NOT_ALLOWED입니다.
openapi.hotel-admin.operation.getRoomStatusHistories.summary=객실 상태 이력 조회
openapi.hotel-admin.operation.getRoomStatusHistories.description=로그인한 호텔 계정(마스터·운영자)의 호텔에 속한 객실 하나의 상태 이력을 최신순(바꾼 시각 내림차순, 같으면 이력 id 내림차순)으로 페이지로 나눠 조회합니다. 객실을 생성할 때 이전 상태가 없는(fromStatus가 null) VACANT 이력이 남고, 그 뒤로 상태가 바뀔 때마다 한 줄씩 남습니다. 바꾼 사람은 호텔 계정 id와 바꿀 때의 이름으로 보여주며, 그 뒤에 계정의 이름이 바뀌거나 계정이 비활성화돼도 이력의 이름은 그대로입니다. changedAt은 UTC의 ISO 8601 문자열(예: "2026-10-30T06:59:32.123456Z")이고, 초 아래 자릿수는 저장된 값(마이크로초까지)에 따라 없거나 3자리씩 늘어납니다(예: "2026-10-30T06:59:32Z", "2026-10-30T06:59:32.120Z"). page는 0~99(기본 0), size는 1~100(기본 10)이고, 범위를 벗어나면 400 INVALID_INPUT으로 응답하고 fieldErrors에 파라미터 이름을 담습니다. 없는 id와 다른 호텔의 객실 id는 모두 404 ROOM_NOT_FOUND로 응답합니다.
openapi.hotel-admin.operation.getRoomStatusHistories.parameter.page=페이지 번호. 0~99, 기본 0
openapi.hotel-admin.operation.getRoomStatusHistories.parameter.size=페이지 크기. 1~100, 기본 10
openapi.schema.RoomStatusHistoryHotelAdminResponse.id=상태 이력 ID
openapi.schema.RoomStatusHistoryHotelAdminResponse.fromStatus=이전 상태. VACANT, RESERVED, OCCUPIED, MAINTENANCE 중 하나이고, 객실 생성 때 남긴 이력이면 null
openapi.schema.RoomStatusHistoryHotelAdminResponse.toStatus=바뀐 상태. VACANT, RESERVED, OCCUPIED, MAINTENANCE 중 하나
openapi.schema.RoomStatusHistoryHotelAdminResponse.changedBy=상태를 바꾼 호텔 계정(바꿀 때의 이름)
openapi.schema.RoomStatusHistoryHotelAdminResponse.changedAt=바꾼 시각. UTC의 ISO 8601 문자열(예: "2026-10-30T06:59:32.123456Z")
openapi.schema.RoomStatusHistoryChangedByHotelAdminResponse.id=호텔 계정 ID
openapi.schema.RoomStatusHistoryChangedByHotelAdminResponse.name=상태를 바꿀 때의 계정 이름. 그 뒤에 이름이 바뀌어도 그대로입니다.
